<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le Ceneri del Divino — Sandbox (v0.6.0)</title>
<style>
:root{
  --bg:#f5f2ec; --surface:#ffffff; --surface2:#eee9df; --border:#d8d0c0;
  --text:#2a2420; --muted:#726a5e; --accent:#7a2e2e; --accent2:#2e4a3f;
  --warn:#a85c1f; --p1:#2e4a3f; --p2:#5a2e6b;
  --t-pers:#2e5a8f; --t-luogo:#8f6a2e; --t-rito:#6b2e8f; --t-evento:#8f2e3a;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b1815; --surface:#262220; --surface2:#2f2a26; --border:#443d36;
    --text:#ece6dd; --muted:#a89d8d; --accent:#d98a8a; --accent2:#8fd1b8;
    --warn:#e0a35c; --p1:#8fd1b8; --p2:#d6a8e8;
    --t-pers:#7fb0e8; --t-luogo:#e0b15c; --t-rito:#c08fe8; --t-evento:#e8808c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1b1815; --surface:#262220; --surface2:#2f2a26; --border:#443d36;
  --text:#ece6dd; --muted:#a89d8d; --accent:#d98a8a; --accent2:#8fd1b8;
  --warn:#e0a35c; --p1:#8fd1b8; --p2:#d6a8e8;
  --t-pers:#7fb0e8; --t-luogo:#e0b15c; --t-rito:#c08fe8; --t-evento:#e8808c;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:Georgia,'Iowan Old Style',serif;font-size:14px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1,h2,h3,h4{font-family:Georgia,serif;margin:.2em 0}
header{padding:12px 16px;border-bottom:2px solid var(--accent);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
header h1{font-size:1.15rem;color:var(--accent)}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:.85rem}
nav button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
main{padding:12px 16px;max-width:1200px;margin:0 auto}
.tab{display:none}
.tab.active{display:block}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:10px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.col{flex:1;min-width:250px}
button{font-family:inherit}
.btn{background:var(--accent2);color:#fff;border:none;padding:6px 10px;border-radius:6px;cursor:pointer;font-size:.8rem;margin:2px}
.btn.alt{background:var(--accent)}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn:disabled{opacity:.4;cursor:not-allowed}
input,select,textarea{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:5px;padding:4px 6px;font-size:.8rem;font-family:inherit}
textarea{width:100%;min-height:40px}
.pill{display:inline-flex;align-items:center;gap:4px;background:var(--surface2);border-radius:20px;padding:3px 10px;font-weight:bold;font-size:.85rem}
.pill input{width:48px}
.icon{width:14px;height:14px;display:inline-block;vertical-align:-2px}
.playerpanel{border-radius:10px;padding:8px;border:2px solid var(--border)}
.playerpanel.p1{border-color:var(--p1)}
.playerpanel.p2{border-color:var(--p2)}
.resline{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.handlist,.areaist,.zone-cards{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.minicard{border:none;padding:0;background:transparent;max-width:190px;cursor:default;margin-bottom:6px;display:inline-block;vertical-align:top}
.gamecard{position:relative;border:1px solid var(--border);border-left:5px solid var(--type-color);border-radius:8px;
  padding:7px 8px 8px;background:var(--surface2);font-size:.72rem;min-height:38px;cursor:pointer}
.gamecard.type-personaggio{--type-color:var(--t-pers)}
.gamecard.type-luogo{--type-color:var(--t-luogo)}
.gamecard.type-rito{--type-color:var(--t-rito)}
.gamecard.type-evento{--type-color:var(--t-evento)}
.gc-rightcol{position:absolute;top:6px;right:6px;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.gc-badges{display:flex;gap:3px}
.gc-badge{font-weight:bold;border-radius:4px;padding:1px 6px;font-size:.78rem;line-height:1.3;border:1px solid}
.gc-badge.inf{background:#000;color:#ffd21a;border-color:#ffd21a}
.gc-badge.cor{background:#000;color:#ff6a6a;border-color:#ff6a6a}
.gc-icon{width:13px;height:13px;flex:none;color:var(--type-color);vertical-align:-2px}
.gc-name{font-variant:small-caps;font-weight:bold;font-size:.88rem;letter-spacing:.3px;
  margin-right:50px;line-height:1.3}
.gc-toggle{background:none;border:none;color:var(--muted);font-size:.78rem;cursor:pointer;padding:0 0 0 4px;line-height:1;vertical-align:middle}
.gc-full{display:none;margin-top:5px;padding-top:4px;border-top:1px dashed var(--border)}
.gamecard:hover .gc-full,.gamecard.open .gc-full{display:block}
.gc-sub{font-size:.66rem;color:var(--muted);margin-bottom:3px}
.gc-effect{font-size:.7rem;line-height:1.3;white-space:normal}
.gc-stat{border:1px solid var(--border);border-radius:5px;
  padding:1px 7px;font-size:.68rem;background:var(--surface);font-weight:bold;text-align:center;line-height:1.4}
.loc{border:1px solid var(--border);border-radius:8px;padding:6px;min-height:90px;background:var(--surface2);font-size:.72rem}
.loc.occ1{border-color:var(--p1)}
.loc.occ2{border-color:var(--p2)}
.loc.conteso{border-color:var(--warn);border-width:2px}
.locrow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;overflow-x:auto}
.locrow .loc{min-width:160px}
.loc-heading{display:flex;justify-content:space-between;align-items:center}
#log{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px;height:150px;overflow-y:auto;font-size:.74rem;overflow-x:auto}
.formgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
.small{font-size:.72rem;color:var(--muted)}
.tag{display:inline-block;background:var(--surface2);border-radius:4px;padding:1px 5px;font-size:.68rem;margin-right:3px}
.player-tag{display:inline-block;font-size:.66rem;border-radius:4px;padding:0 4px}
.player-tag.p1{background:var(--p1);color:#fff}
.player-tag.p2{background:var(--p2);color:#fff}
.flex-between{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.banner{background:var(--warn);color:#1b1815;border-radius:8px;padding:10px;margin-bottom:10px;font-weight:bold}
.manual-controls{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.marketslot{border:1px dashed var(--border);border-radius:8px;padding:4px;min-width:170px}
.navlink{display:inline-block;background:transparent;border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:6px;font-size:.85rem;text-decoration:none}
</style>
</head>
<body>
<header>
  <h1>⚜ Le Ceneri del Divino — Sandbox</h1>
  <nav id="tabs"></nav>
  <a class="navlink" href="stampa-carte.html">Stampa carte</a>
  <a class="navlink" href="assistente-partita.html">Assistente di partita</a>
</header>
<main>
  <div class="tab active" id="tab-partita"></div>
  <div class="tab" id="tab-carte"></div>
  <div class="tab" id="tab-mazzi"></div>
  <div class="tab" id="tab-dati"></div>
</main>

<script>
/* ======================================================================
   SANDBOX MANUALE — nessuna fase, turno o azione è imposta dal motore.
   Lo strumento tiene il conto (mazzi, mani, Luoghi, risorse, Mercato,
   Eventi) e offre un pulsante per ogni spostamento possibile; sei tu
   l'arbitro e decidi quando applicare costi, effetti e controllo.
   Dati conformi al regolamento v0.6.0 (mazzo da 20, 4 Luoghi, Mazzo
   Mercenario → Mercato, Mazzo Eventi separato, nessuno scontro).
   ====================================================================== */
const ICO = {
 inf:`<svg class="icon" viewBox="0 0 24 24"><path d="M12 2l3 7h7l-5.5 4.5L18.5 21 12 16.5 5.5 21l2-7.5L2 9h7z" fill="var(--warn)"/></svg>`,
 cor:`<svg class="icon" viewBox="0 0 24 24"><path d="M12 2C9 7 5 10 5 14.5A7 7 0 0019 14.5C19 10 15 7 12 2z" fill="var(--accent)"/></svg>`,
 pre:`<svg class="icon" viewBox="0 0 24 24"><path d="M12 2l2.6 6.9L22 9.5l-5.6 4.8L18 22l-6-4-6 4 1.6-7.7L2 9.5l7.4-.6z" fill="var(--accent2)"/></svg>`,
 type:{
   personaggio:`<svg class="gc-icon" viewBox="0 0 24 24"><circle cx="12" cy="7" r="4" fill="currentColor"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8" fill="currentColor"/></svg>`,
   luogo:`<svg class="gc-icon" viewBox="0 0 24 24"><path d="M12 2C7.6 2 4 5.6 4 10c0 6 8 12 8 12s8-6 8-12c0-4.4-3.6-8-8-8zm0 11a3 3 0 110-6 3 3 0 010 6z" fill="currentColor"/></svg>`,
   rito:`<svg class="gc-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M12 5.5l1.8 4.6h4.7l-3.8 2.9 1.4 4.6L12 14.9l-4.1 2.7 1.4-4.6-3.8-2.9h4.7z" fill="currentColor"/></svg>`,
   evento:`<svg class="gc-icon" viewBox="0 0 24 24"><path d="M13 2L4 14h6l-1 8 9-12h-6z" fill="currentColor"/></svg>`,
 },
};
const FACTIONS = ["La Comunione","Creature della notte","Devoti dei Primi Figli","Gli Spontanei","Le Accademie del Velo","Le Terre Contese"];
const CARD_FACTIONS = [...FACTIONS, "Mercenario"];
const LOCATION_COUNT = 4;
const uid = ()=>Math.random().toString(36).slice(2,10);
function typeLabel(t){ return {personaggio:'Personaggio',luogo:'Luogo',rito:'Rito',evento:'Evento'}[t]||t; }
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function esc(s){ return (s||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }

let S = {
  pool: [], decks: [], playerDeck:[null,null],
  players: [newPlayer("Giocatore 1"), newPlayer("Giocatore 2")],
  locations: freshLocations(),
  round:1, started:false, matchOver:null,
  active:0,
  activeEvent:null, eventDeck:[], eventDiscard:[],
  mercenarioDeck:[], mercenarioDiscard:[], market:[null,null,null],
  showDeck:[false,false], showDiscard:[false,false], showRemoved:[false,false],
  showMercDeck:false,
  log:[],
};
function newPlayer(name){ return {name, influence:0, corruption:0, prestige:0, deck:[], hand:[], discard:[], removed:[], persistentRiti:[], faction:null}; }
function freshLocations(){ return Array.from({length:LOCATION_COUNT},()=>({cardId:null, builder:null, chars:[], controller:null})); }
let cardOpen = {};
function toggleCardOpen(key){ cardOpen[key]=!cardOpen[key]; render(); }
let toast = null;
function showToast(t){ toast={text:t}; render(); }
function toastHtml(){
  if(!toast) return '';
  return `<div class="banner" style="background:var(--accent);color:#fff">${esc(toast.text)} <button class="btn ghost" style="border-color:#fff;color:#fff" onclick="toast=null;render()">✕</button></div>`;
}
let confirmingDelete = {};

function cardById(id){ return S.pool.find(c=>c.id===id); }
function logMsg(t){ S.log.unshift(`[Round ${S.round}] ${t}`); }

function setManualResource(pi,resource,value){
  if(!['influence','corruption','prestige'].includes(resource)) return;
  const amount=Number.parseInt(value,10);
  if(!Number.isFinite(amount)) return;
  S.players[pi][resource]=Math.max(0,amount);
  render();
}
function bumpResource(pi,resource,delta){ setManualResource(pi,resource, (S.players[pi][resource]||0)+delta); }

function drawCard(pi){
  const p=S.players[pi];
  if(!p.deck.length){ showToast(p.discard.length? `Mazzo di ${p.name} vuoto: mischia manualmente gli scarti nel mazzo.` : `Mazzo e scarti di ${p.name} vuoti.`); return; }
  const id=p.deck.shift(); p.hand.push(id);
  logMsg(`${p.name} pesca "${cardById(id)?.name||'?'}" (mano: ${p.hand.length}).`);
  render();
}
function shuffleDeck(pi){ S.players[pi].deck=shuffle(S.players[pi].deck); logMsg(`${S.players[pi].name} mischia il mazzo.`); render(); }
function shuffleDiscardIntoDeck(pi){ const p=S.players[pi]; if(!p.discard.length) return; p.deck=shuffle([...p.deck,...p.discard]); p.discard=[]; logMsg(`${p.name} mischia gli scarti nel mazzo.`); render(); }
function peekTop(pi){ const p=S.players[pi]; if(!p.deck.length){ showToast('Mazzo vuoto.'); return; } showToast(`Prima carta del mazzo di ${p.name}: ${cardById(p.deck[0]).name}`); }

/* ====================== LIBRERIA MAZZI (più mazzi di Fazione salvabili, riutilizzabili su entrambi i giocatori) ====================== */
function deckById(id){ return S.decks.find(d=>d.id===id); }
function deckCountOf(deck){ return deck? deck.list.reduce((s,e)=>s+e.qty,0) : 0; }
function deckValidOf(deck){
  if(!deck || !deck.faction || deckCountOf(deck)!==20) return false;
  for(const e of deck.list){ const c=cardById(e.cardId); if(!c) return false;
    if(c.type==='evento' || c.fazione==='Mercenario' || c.fazione!==deck.faction) return false;
    if(c.legendary && e.qty>1) return false; if(!c.legendary && e.qty>2) return false; }
  return true;
}
function createDeck(){
  const d={id:uid(), name:`Nuovo mazzo ${S.decks.length+1}`, faction:null, list:[]};
  S.decks.push(d); deckEditor={mode:'edit', id:d.id}; render();
}
function duplicateDeck(id){
  const src=deckById(id); if(!src) return;
  const copy={id:uid(), name:src.name+' (copia)', faction:src.faction, list:src.list.map(e=>({...e}))};
  S.decks.push(copy); render();
}
function renameDeck(id,name){ const d=deckById(id); if(!d) return; d.name=name||d.name; render(); }
function deleteDeck(id){
  S.decks=S.decks.filter(d=>d.id!==id);
  S.playerDeck=S.playerDeck.map(x=>x===id?null:x);
  if(deckEditor.id===id) deckEditor={mode:'list'};
  render();
}
function setDeckFactionOf(id, fac){ const d=deckById(id); if(!d) return; d.faction=fac||null; d.list=[]; render(); }
function addCardToDeck(deckId,cardId){
  const d=deckById(deckId); const c=cardById(cardId); if(!d||!c) return;
  if(c.type==='evento'){ showToast('Le carte Evento non fanno parte del Mazzo di Fazione.'); return; }
  if(c.fazione==='Mercenario'){ showToast('Le carte Mercenario alimentano il Mercato, non il Mazzo di Fazione.'); return; }
  if(d.faction && c.fazione!==d.faction){ showToast(`Questa carta appartiene a "${c.fazione}", diversa dalla fazione del mazzo.`); return; }
  let e=d.list.find(x=>x.cardId===cardId); const max=c.legendary?1:2;
  if(e){ if(e.qty<max) e.qty++; } else d.list.push({cardId,qty:1});
  render();
}
function removeCardFromDeck(deckId,cardId){
  const d=deckById(deckId); if(!d) return;
  const e=d.list.find(x=>x.cardId===cardId);
  if(!e) return; e.qty--; if(e.qty<=0) d.list=d.list.filter(x=>x!==e);
  render();
}
function setPlayerDeck(pi,deckId){ S.playerDeck[pi]=deckId||null; render(); }

function startMatch(){
  for(let pi=0;pi<2;pi++){
    const deck=deckById(S.playerDeck[pi]); let ids=[];
    if(deck) deck.list.forEach(e=>{ for(let i=0;i<e.qty;i++) ids.push(e.cardId); });
    const p=S.players[pi];
    p.deck=shuffle(ids); p.hand=[]; p.discard=[]; p.removed=[]; p.persistentRiti=[];
    p.influence=0; p.corruption=0; p.prestige=0; p.faction=deck?deck.faction:null;
  }
  S.locations=freshLocations();
  S.eventDeck=shuffle(S.pool.filter(c=>c.type==='evento').map(c=>c.id)); S.eventDiscard=[]; S.activeEvent=null;
  S.mercenarioDeck=shuffle(S.pool.filter(c=>c.fazione==='Mercenario').map(c=>c.id)); S.mercenarioDiscard=[]; S.market=[null,null,null];
  S.round=1; S.matchOver=null; S.log=[]; S.started=true; S.active=0;
  logMsg(`Sandbox avviata — ${S.players[0].name} (${S.players[0].faction||'—'}) contro ${S.players[1].name} (${S.players[1].faction||'—'}). Nulla è automatico: pesche, costi, Preparazione, Mercato e fine Round li gestisci tu con i pulsanti.`);
  render();
}
function stopMatch(){
  if(!confirm('Terminare la sandbox? La disposizione attuale delle carte non verrà conservata.')) return;
  S.started=false; S.matchOver=null; S.locations=freshLocations();
  S.players.forEach(p=>{ p.deck=[]; p.hand=[]; p.discard=[]; p.removed=[]; p.persistentRiti=[]; });
  S.activeEvent=null; S.eventDeck=[]; S.eventDiscard=[]; S.mercenarioDeck=[]; S.mercenarioDiscard=[]; S.market=[null,null,null]; S.log=[];
  render();
}
function setManualActivePlayer(pi){ S.active=Number(pi); render(); }
function changeManualRound(delta){ S.round=Math.max(1,S.round+delta); render(); }
function setMatchWinner(pi){ S.matchOver = pi===null?'Pareggio':S.players[pi].name; logMsg(S.matchOver==='Pareggio'?'Partita segnata come pareggio.':`Vittoria assegnata a ${S.matchOver}.`); render(); }
function clearMatchWinner(){ S.matchOver=null; render(); }

const ZONE_LABEL = {hand:'mano',discard:'scarti',removed:'rimosse',top:'cima mazzo',bottom:'fondo mazzo'};
function putInZone(p,id,dest){
  if(dest==='hand') p.hand.push(id);
  else if(dest==='discard') p.discard.push(id);
  else if(dest==='removed') p.removed.push(id);
  else if(dest==='top') p.deck.unshift(id);
  else if(dest==='bottom') p.deck.push(id);
}
function moveHandCard(pi,idx,dest){ const p=S.players[pi]; const id=p.hand.splice(idx,1)[0]; if(id===undefined) return; putInZone(p,id,dest); logMsg(`${p.name} sposta "${cardById(id)?.name||'?'}" dalla mano a ${ZONE_LABEL[dest]}.`); render(); }
function moveDeckCard(pi,idx,dest){ const p=S.players[pi]; const id=p.deck.splice(idx,1)[0]; if(id===undefined) return; putInZone(p,id,dest); logMsg(`${p.name} sposta "${cardById(id)?.name||'?'}" dal mazzo a ${ZONE_LABEL[dest]}.`); render(); }
function moveDiscardCard(pi,idx,dest){ const p=S.players[pi]; const id=p.discard.splice(idx,1)[0]; if(id===undefined) return; putInZone(p,id,dest); logMsg(`${p.name} sposta "${cardById(id)?.name||'?'}" dagli scarti a ${ZONE_LABEL[dest]}.`); render(); }
function moveRemovedCard(pi,idx,dest){ const p=S.players[pi]; const id=p.removed.splice(idx,1)[0]; if(id===undefined) return; putInZone(p,id,dest); logMsg(`${p.name} sposta "${cardById(id)?.name||'?'}" dalle rimosse a ${ZONE_LABEL[dest]}.`); render(); }
function movePersistentRito(pi,idx,dest){ const p=S.players[pi]; const id=p.persistentRiti.splice(idx,1)[0]; if(id===undefined) return; putInZone(p,id,dest); logMsg(`${p.name} sposta "${cardById(id)?.name||'?'}" dai riti persistenti a ${ZONE_LABEL[dest]}.`); render(); }
function handRitoToPersistent(pi,idx){ const p=S.players[pi]; const id=p.hand.splice(idx,1)[0]; if(id===undefined) return; p.persistentRiti.push(id); logMsg(`${p.name} sposta "${cardById(id)?.name||'?'}" dalla mano ai riti persistenti.`); render(); }

function placeLuogoInSlot(pi,handIdx,slot){
  const p=S.players[pi]; const id=p.hand[handIdx]; const c=cardById(id);
  if(!c||c.type!=='luogo'||S.locations[slot].cardId) return;
  p.hand.splice(handIdx,1); S.locations[slot]={cardId:id, builder:pi, chars:[], controller:null};
  logMsg(`${p.name} posiziona "${c.name}" nello spazio ${slot+1}.`);
  render();
}
function deployCharacterToLocation(pi,handIdx,slot){
  const p=S.players[pi]; const id=p.hand[handIdx]; const c=cardById(id);
  if(!c||c.type!=='personaggio'||!S.locations[slot].cardId) return;
  p.hand.splice(handIdx,1); S.locations[slot].chars.push({instId:uid(), cardId:id, owner:pi});
  logMsg(`${p.name} schiera "${c.name}" nel luogo ${slot+1}.`);
  render();
}
function moveLocationCard(slot,dest){
  const l=S.locations[slot]; if(!l.cardId) return;
  const pi = l.builder!=null? l.builder : S.active; const p=S.players[pi]; const id=l.cardId;
  putInZone(p,id,dest);
  S.locations[slot]={cardId:null,builder:null,chars:l.chars,controller:null};
  logMsg(`"${cardById(id)?.name||'?'}" tolto dal luogo ${slot+1} e spostato a ${ZONE_LABEL[dest]} di ${p.name}.`);
  render();
}
function moveLocationToSlot(fromSlot,toSlot){
  if(fromSlot===toSlot || S.locations[toSlot].cardId || S.locations[toSlot].chars.length || !S.locations[fromSlot].cardId) return;
  S.locations[toSlot]=S.locations[fromSlot]; S.locations[fromSlot]={cardId:null,builder:null,chars:[],controller:null};
  logMsg(`Luogo spostato dallo spazio ${fromSlot+1} allo spazio ${toSlot+1}.`);
  render();
}
function setLocationController(slot,pi){ S.locations[slot].controller = pi; logMsg(`Controllo del luogo ${slot+1} impostato su ${pi==null?'nessuno':S.players[pi].name}.`); render(); }
function moveCharacterFromLocation(slot,instId,dest){
  const loc=S.locations[slot]; const idx=loc.chars.findIndex(c=>c.instId===instId); if(idx<0) return;
  const [inst]=loc.chars.splice(idx,1); const p=S.players[inst.owner]; putInZone(p,inst.cardId,dest);
  logMsg(`"${cardById(inst.cardId)?.name||'?'}" tolto dal luogo ${slot+1} e spostato a ${ZONE_LABEL[dest]} di ${p.name}.`);
  render();
}
function moveCharacterToLocation(fromSlot,instId,toSlot){
  if(fromSlot===toSlot) return;
  const src=S.locations[fromSlot]; const idx=src.chars.findIndex(c=>c.instId===instId); if(idx<0) return;
  const [inst]=src.chars.splice(idx,1); S.locations[toSlot].chars.push(inst);
  logMsg(`"${cardById(inst.cardId)?.name||'?'}" spostato al luogo ${toSlot+1}.`);
  render();
}
function changeCharacterOwner(slot,instId,pi){
  const inst=S.locations[slot].chars.find(c=>c.instId===instId); if(!inst||(pi!==0&&pi!==1)) return;
  inst.owner=pi; logMsg(`Controllo di "${cardById(inst.cardId)?.name||'?'}" assegnato a ${S.players[pi].name}.`); render();
}
function removePersistentRito(pi, idx){ movePersistentRito(pi, idx, 'discard'); }

function revealNextEvent(){
  if(!S.eventDeck.length){ if(S.eventDiscard.length){ S.eventDeck=shuffle(S.eventDiscard); S.eventDiscard=[]; logMsg('Mazzo Eventi esaurito: si rimescolano gli Scarti Eventi.'); } else { showToast('Mazzo Eventi e Scarti Eventi vuoti.'); return; } }
  if(S.activeEvent) S.eventDiscard.push(S.activeEvent);
  S.activeEvent=S.eventDeck.shift();
  logMsg(`Rivelato l'Evento "${cardById(S.activeEvent).name}".`);
  render();
}
function discardActiveEvent(){ if(!S.activeEvent) return; S.eventDiscard.push(S.activeEvent); logMsg(`Evento "${cardById(S.activeEvent).name}" scartato.`); S.activeEvent=null; render(); }

function refillMarketSlot(slot){
  if(S.market[slot]) return;
  if(!S.mercenarioDeck.length){ if(S.mercenarioDiscard.length){ S.mercenarioDeck=shuffle(S.mercenarioDiscard); S.mercenarioDiscard=[]; logMsg('Mazzo Mercenario esaurito: si rimescolano gli Scarti Mercenari.'); } else { showToast('Mazzo Mercenario e Scarti Mercenari vuoti.'); return; } }
  S.market[slot]=S.mercenarioDeck.shift();
  render();
}
function moveMarketCard(slot,dest){
  const id=S.market[slot]; if(!id) return;
  if(dest==='mercDiscard'){ S.mercenarioDiscard.push(id); }
  else { const pi=Number(dest.slice(1,2)); const zone=dest.slice(2); const p=S.players[pi]; putInZone(p,id,zone);
    logMsg(`"${cardById(id)?.name||'?'}" preso dal Mercato e messo in ${ZONE_LABEL[zone]} di ${p.name}.`); }
  S.market[slot]=null; render();
}
function shuffleMercDiscardIntoDeck(){ if(!S.mercenarioDiscard.length) return; S.mercenarioDeck=shuffle([...S.mercenarioDeck,...S.mercenarioDiscard]); S.mercenarioDiscard=[]; logMsg('Scarti Mercenari rimescolati nel Mazzo Mercenario.'); render(); }
function moveMercDeckCard(i,pi){ const id=S.mercenarioDeck.splice(i,1)[0]; if(id===undefined) return; S.players[pi].hand.push(id); logMsg(`"${cardById(id)?.name||'?'}" preso dal Mazzo Mercenario e messo in mano a ${S.players[pi].name}.`); render(); }

let editingCard=null;
function upsertCard(data){ if(editingCard){ Object.assign(cardById(editingCard),data); editingCard=null; } else S.pool.push({id:uid(),...data}); render(); }
function askDeleteCard(id){ confirmingDelete[id]=true; render(); }
function cancelDeleteCard(id){ confirmingDelete[id]=false; render(); }
function deleteCard(id){ S.pool=S.pool.filter(c=>c.id!==id); S.decks.forEach(d=>{ const i=d.list.findIndex(e=>e.cardId===id); if(i>=0) d.list.splice(i,1); }); delete confirmingDelete[id]; render(); }

async function exportData(){
  const data=JSON.stringify({pool:S.pool, decks:S.decks, playerDeck:S.playerDeck},null,2);
  try{ const d=await claude.use("downloads"); if(d){ await d.save({filename:"ceneri-del-divino-dati.json", data}); return; } }catch(e){}
  const blob=new Blob([data],{type:"application/json"}); const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download="ceneri-del-divino-dati.json"; a.click();
}
function importData(file){
  const r=new FileReader();
  r.onload=()=>{ try{ const o=JSON.parse(r.result);
      if(o.pool) S.pool=o.pool.map(c=>({fazione:'',tipologia:'',...c}));
      if(o.decks) S.decks=o.decks;
      else if(o.decklists && o.deckFaction){
        // compatibilità con l'export a mazzo singolo delle versioni precedenti
        S.decks = o.decklists.map((list,i)=> list.length? {id:uid(), name:`Mazzo importato ${i+1}`, faction:o.deckFaction[i]||null, list} : null).filter(Boolean);
      }
      if(o.playerDeck) S.playerDeck=o.playerDeck;
      render();
    }catch(e){ showToast('File non valido.'); } };
  r.readAsText(file);
}

/* forceOpen=true mostra sempre testo effetto/dettagli senza dover cliccare
   (usato per i Luoghi in campo, così l'effetto è sempre visibile). */
function cardFace(c, inst, forceOpen){
  if(!c) return '';
  const key = inst? inst.instId : c.id;
  const isOpen = forceOpen || !!cardOpen[key];
  let sub=[typeLabel(c.type)];
  sub.push(c.fazione? c.fazione : 'Mazzo Eventi / Mercato');
  if(c.tipologia) sub.push(c.tipologia);
  if(c.type==='luogo') sub.push('Prestigio prodotto: '+(c.prestigio||0));
  if(c.type==='rito') sub.push(c.ritoTipo==='persistente'?'Persistente':'Immediato');
  if(c.legendary) sub.push('Leggendaria');
  return `<div class="gamecard type-${c.type} ${isOpen?'open':''}">
    <div class="gc-rightcol">
      ${c.type==='personaggio'?`<div class="gc-stat">F ${c.forza||0}<br>R ${c.resistenza||0}</div>`:''}
      <div class="gc-badges">
        <span class="gc-badge inf" title="Costo Influenza">${c.costInf||0}</span>
        ${c.costCor?`<span class="gc-badge cor" title="Costo Corruzione">${c.costCor}</span>`:''}
      </div>
    </div>
    <div class="gc-name">${ICO.type[c.type]||''} ${esc(c.name)}
      ${forceOpen?'':`<button class="gc-toggle" onclick="event.stopPropagation();toggleCardOpen('${key}')" title="Mostra/nascondi dettagli">${isOpen?'▲':'ⓘ'}</button>`}
    </div>
    <div class="gc-full">
      <div class="gc-sub">${sub.join(' · ')}</div>
      <div class="gc-effect">${esc(c.effetto||'')||'<span class=\"small\">(nessun testo effetto)</span>'}</div>
    </div>
  </div>`;
}

function setTab(t){ activeTab=t; render(); }
function render(){
  const tabsEl=document.getElementById('tabs');
  const tabs=[['partita','Partita'],['carte','Carte'],['mazzi','Mazzi'],['dati','Dati']];
  tabsEl.innerHTML=tabs.map(([k,l])=>`<button class="${activeTab===k?'active':''}" onclick="setTab('${k}')">${l}</button>`).join('');
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-'+activeTab).classList.add('active');
  renderPartita(); renderCarte(); renderMazzi(); renderDati();
}

function handCardFooter(pi, idx, c){

          <button class="btn ghost" onclick="moveCharacterFromLocation(${slot},'${ch.instId}','discard')">→ Scarti</button>
          <button class="btn ghost" onclick="moveCharacterFromLocation(${slot},'${ch.instId}','removed')">→ Rimosse</button>
          <button class="btn ghost" onclick="moveCharacterFromLocation(${slot},'${ch.instId}','top')">→ Cima mazzo</button>
          <button class="btn ghost" onclick="moveCharacterFromLocation(${slot},'${ch.instId}','bottom')">→ Fondo mazzo</button>
        </div>
      </div>`;
    });
    html += `</div>`;
  });
  html += `</div><button class="btn ghost" style="margin-top:8px" onclick="stopMatch()">Termina sandbox</button></div>`;

  html += `<div class="card"><h3>Registro</h3><div id="log">${S.log.map(esc).join('<br>')}</div></div>`;
  el.innerHTML=html;
}

function renderCarte(){
  const el=document.getElementById('tab-carte');
  const editing=editingCard?cardById(editingCard):null;
  el.innerHTML = toastHtml() + `<div class="card"><h2>${editing?'Modifica carta':'Nuova carta'}</h2>
    <form id="cardForm" class="formgrid" onsubmit="return false">
      <input name="name" placeholder="Nome" value="${editing?esc(editing.name):''}" required>
      <select name="type">${['personaggio','luogo','rito','evento'].map(t=>`<option value="${t}" ${editing&&editing.type===t?'selected':''}>${typeLabel(t)}</option>`).join('')}</select>
      <select name="fazione"><option value="">— nessuna (Evento) —</option>${CARD_FACTIONS.map(f=>`<option value="${f}" ${editing&&editing.fazione===f?'selected':''}>${f}</option>`).join('')}</select>
      <input name="tipologia" placeholder="Tipologia (es. Umano, Non morto)" value="${editing?esc(editing.tipologia||''):''}">
      <label class="small"><input type="checkbox" name="legendary" ${editing&&editing.legendary?'checked':''}> Leggendaria</label>
      <input name="costInf" type="number" min="0" placeholder="Costo Influenza" value="${editing?editing.costInf||0:0}">
      <input name="costCor" type="number" min="0" placeholder="Costo Corruzione" value="${editing?editing.costCor||0:0}">
      <input name="forza" type="number" min="0" placeholder="Forza" value="${editing?editing.forza||0:0}">
      <input name="resistenza" type="number" min="0" placeholder="Resistenza" value="${editing?editing.resistenza||0:0}">
      <input name="prestigio" type="number" min="0" placeholder="Prestigio prodotto" value="${editing?editing.prestigio||0:0}">
      <select name="ritoTipo"><option value="immediato" ${editing&&editing.ritoTipo==='immediato'?'selected':''}>Rito immediato</option><option value="persistente" ${editing&&editing.ritoTipo==='persistente'?'selected':''}>Rito persistente</option></select>
      <textarea name="effetto" placeholder="Testo effetto" style="grid-column:1/-1">${editing?esc(editing.effetto||''):''}</textarea>
      <div style="grid-column:1/-1"><button class="btn" onclick="submitCardForm()">${editing?'Salva modifiche':'Aggiungi al pool'}</button>${editing?'<button class="btn ghost" onclick="editingCard=null;render()">Annulla</button>':''}</div>
    </form></div>
    <div class="card"><h2>Pool carte (${S.pool.length})</h2>
    <div class="handlist">${S.pool.map(c=>`<div class="minicard">${cardFace(c)}<div style="margin-top:3px">
      ${confirmingDelete[c.id]?
        `<span class="small">Eliminare "${esc(c.name)}"?</span> <button class="btn alt" onclick="deleteCard('${c.id}')">Conferma</button><button class="btn ghost" onclick="cancelDeleteCard('${c.id}')">Annulla</button>`
        :`<button class="btn ghost" onclick="editingCard='${c.id}';render()">✎ Modifica</button><button class="btn ghost" onclick="askDeleteCard('${c.id}')">🗑 Elimina</button>`}
      </div></div>`).join('')||'<span class="small">Nessuna carta.</span>'}</div></div>`;
}
function submitCardForm(){
  const f=document.getElementById('cardForm');
  upsertCard({ name:f.name.value.trim()||'Senza nome', type:f.type.value, fazione:f.fazione.value, tipologia:f.tipologia.value.trim(),
    legendary:f.legendary.checked, costInf:+f.costInf.value||0, costCor:+f.costCor.value||0, costPre:0,
    forza:+f.forza.value||0, resistenza:+f.resistenza.value||0, prestigio:+f.prestigio.value||0,
    ritoTipo:f.ritoTipo.value, fase:'', effetto:f.effetto.value.trim() });
}

function renderMazzi(){
  const el=document.getElementById('tab-mazzi');
  let html=toastHtml();
  if(deckEditor.mode==='edit'){
    const d=deckById(deckEditor.id);
    if(!d){ deckEditor={mode:'list'}; renderMazzi(); return; }
    const avail=S.pool.filter(c=>c.type!=='evento' && c.fazione!=='Mercenario' && (!d.faction || c.fazione===d.faction));
    html += `<div class="card flex-between">
      <div><button class="btn ghost" onclick="deckEditor={mode:'list'};render()">← Tutti i mazzi</button>
        <input value="${esc(d.name)}" onchange="renameDeck('${d.id}',this.value)" style="margin-left:6px"></div>
      <div><b>${deckCountOf(d)}/20</b> ${deckValidOf(d)?'✅':'❌'}</div>
    </div>
    <div class="card">
      <label class="small">Fazione del mazzo — <select onchange="setDeckFactionOf('${d.id}', this.value)">
        <option value="">— scegli —</option>
        ${FACTIONS.map(f=>`<option value="${f}" ${d.faction===f?'selected':''}>${f}</option>`).join('')}
      </select></label>
      ${d.list.length?'<p class="small">Cambiare fazione svuota il mazzo.</p>':''}
      <div class="row">
        <div class="col"><h4>Pool disponibile (${d.faction||'scegli una fazione'})</h4>${avail.map(c=>`<div class="minicard" onclick="addCardToDeck('${d.id}','${c.id}')">${cardFace(c)}</div>`).join('')||'<span class="small">Nessuna carta.</span>'}</div>
        <div class="col"><h4>Nel mazzo</h4>${d.list.map(e=>{const c=cardById(e.cardId); if(!c) return ''; return `<div class="minicard"><div class="small">×${e.qty}</div>${cardFace(c)}<button class="btn ghost" onclick="removeCardFromDeck('${d.id}','${e.cardId}')">− Rimuovi</button></div>`}).join('')||'<span class="small">Vuoto</span>'}</div>
      </div>
    </div>`;
    el.innerHTML=html;
    return;
  }
  html += `<div class="card flex-between"><h2>I tuoi mazzi (${S.decks.length})</h2><button class="btn" onclick="createDeck()">+ Nuovo mazzo</button></div>`;
  html += `<div class="row">${S.decks.map(d=>`
    <div class="col card">
      <h3>${esc(d.name)}</h3>
      <p class="small">${d.faction||'nessuna fazione scelta'} — ${deckCountOf(d)}/20 ${deckValidOf(d)?'✅':'❌'}</p>
      <div class="manual-controls">
        <button class="btn ghost" onclick="deckEditor={mode:'edit',id:'${d.id}'};render()">✎ Apri/Modifica</button>
        <button class="btn ghost" onclick="duplicateDeck('${d.id}')">⧉ Duplica</button>
        <button class="btn ghost" onclick="if(confirm('Eliminare il mazzo \\'${esc(d.name).replace(/'/g,"\\'")}\\'
?')) deleteDeck('${d.id}')">🗑 Elimina</button>
      </div>
      <div class="manual-controls">
        <button class="btn ghost" onclick="setPlayerDeck(0,'${d.id}')">Usa per ${esc(S.players[0].name)}</button>
        <button class="btn ghost" onclick="setPlayerDeck(1,'${d.id}')">Usa per ${esc(S.players[1].name)}</button>
      </div>
    </div>`).join('')||'<p class="small">Nessun mazzo creato — premi "+ Nuovo mazzo" per iniziare.</p>'}</div>`;
  el.innerHTML=html;
}
function renderDati(){
  document.getElementById('tab-dati').innerHTML = toastHtml() + `<div class="card"><h2>Esporta / Importa dati</h2>
    <p class="small">Salva pool carte, mazzi e fazioni scelte come file JSON.</p>
    <button class="btn" onclick="exportData()">⬇ Esporta dati</button>
    <div style="margin-top:10px"><label class="small">Importa file: <input type="file" accept=".json" onchange="importData(this.files[0])"></label></div>
    <p class="small" style="margin-top:10px">Nota: la partita/sandbox in corso non viene esportata, solo pool carte, mazzi e fazioni.</p></div>`;
}

render();
</script>
</body>
</html>
