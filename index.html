<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le Ceneri del Divino — Simulatore</title>
<style>
:root{
  --bg:#f5f2ec; --surface:#ffffff; --surface2:#eee9df; --border:#d8d0c0;
  --text:#2a2420; --muted:#726a5e; --accent:#7a2e2e; --accent2:#2e4a3f;
  --warn:#a85c1f; --p1:#2e4a3f; --p2:#5a2e6b;
  --t-pers:#2e5a8f; --t-luogo:#8f6a2e; --t-rito:#6b2e8f; --t-evento:#8f2e3a;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b1815; --surface:#262220; --surface2:#2f2a26; --border:#443d36;
    --text:#ece6dd; --muted:#a89d8d; --accent:#d98a8a; --accent2:#8fd1b8;
    --warn:#e0a35c; --p1:#8fd1b8; --p2:#d6a8e8;
    --t-pers:#7fb0e8; --t-luogo:#e0b15c; --t-rito:#c08fe8; --t-evento:#e8808c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1b1815; --surface:#262220; --surface2:#2f2a26; --border:#443d36;
  --text:#ece6dd; --muted:#a89d8d; --accent:#d98a8a; --accent2:#8fd1b8;
  --warn:#e0a35c; --p1:#8fd1b8; --p2:#d6a8e8;
  --t-pers:#7fb0e8; --t-luogo:#e0b15c; --t-rito:#c08fe8; --t-evento:#e8808c;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:Georgia,'Iowan Old Style',serif;font-size:14px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1,h2,h3,h4{font-family:Georgia,serif;margin:.2em 0}
header{padding:12px 16px;border-bottom:2px solid var(--accent);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
header h1{font-size:1.15rem;color:var(--accent)}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:.85rem}
nav button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
main{padding:12px 16px;max-width:1200px;margin:0 auto}
.tab{display:none}
.tab.active{display:block}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:10px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.col{flex:1;min-width:250px}
button{font-family:inherit}
.btn{background:var(--accent2);color:#fff;border:none;padding:6px 10px;border-radius:6px;cursor:pointer;font-size:.8rem;margin:2px}
.btn.alt{background:var(--accent)}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn:disabled{opacity:.4;cursor:not-allowed}
input,select,textarea{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:5px;padding:4px 6px;font-size:.8rem;font-family:inherit}
textarea{width:100%;min-height:40px}
.pill{display:inline-flex;align-items:center;gap:4px;background:var(--surface2);border-radius:20px;padding:3px 10px;font-weight:bold;font-size:.85rem}
.icon{width:14px;height:14px;display:inline-block;vertical-align:-2px}
.playerpanel{border-radius:10px;padding:8px;border:2px solid var(--border)}
.playerpanel.p1{border-color:var(--p1)}
.playerpanel.p2{border-color:var(--p2)}
.playerpanel.active{box-shadow:0 0 0 2px var(--warn)}
.resline{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.handlist,.areaist{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.minicard{border:none;padding:0;background:transparent;max-width:185px;cursor:default;margin-bottom:6px;display:inline-block;vertical-align:top}
.gamecard{position:relative;border:1px solid var(--border);border-left:5px solid var(--type-color);border-radius:8px;
  padding:7px 8px 8px;background:var(--surface2);font-size:.72rem;min-height:38px;cursor:pointer}
.gamecard.type-personaggio{--type-color:var(--t-pers)}
.gamecard.type-luogo{--type-color:var(--t-luogo)}
.gamecard.type-rito{--type-color:var(--t-rito)}
.gamecard.type-evento{--type-color:var(--t-evento)}
.gc-rightcol{position:absolute;top:6px;right:6px;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.gc-badges{display:flex;gap:3px}
.gc-badge{font-weight:bold;border-radius:4px;padding:1px 6px;font-size:.78rem;line-height:1.3;border:1px solid}
.gc-badge.inf{background:#000;color:#ffd21a;border-color:#ffd21a}
.gc-badge.cor{background:#000;color:#ff6a6a;border-color:#ff6a6a}
.gc-icon{width:13px;height:13px;flex:none;color:var(--type-color);vertical-align:-2px}
.gc-name{font-variant:small-caps;font-weight:bold;font-size:.82rem;letter-spacing:.3px;
  margin-right:50px;line-height:1.3}
.gc-firstline{display:inline-flex;align-items:baseline;gap:3px;white-space:nowrap;vertical-align:baseline}
.gc-toggle{background:none;border:none;color:var(--muted);font-size:.78rem;cursor:pointer;padding:0 0 0 4px;line-height:1;vertical-align:middle}
.gc-full{display:none;margin-top:5px;padding-top:4px;border-top:1px dashed var(--border)}
.gamecard:hover .gc-full,.gamecard.open .gc-full{display:block}
.gc-sub{font-size:.66rem;color:var(--muted);margin-bottom:3px}
.gc-effect{font-size:.7rem;line-height:1.3;white-space:normal}
.gc-dmg{font-size:.68rem;color:var(--accent);margin-top:3px;font-weight:bold}
.gc-stat{border:1px solid var(--border);border-radius:5px;
  padding:1px 7px;font-size:.68rem;background:var(--surface);font-weight:bold;text-align:center;line-height:1.4}
.gc-art{width:100%;max-height:110px;object-fit:cover;border-radius:5px;margin-bottom:4px;display:block;background:var(--surface)}
.loc{border:1px solid var(--border);border-radius:8px;padding:6px;min-height:90px;background:var(--surface2);font-size:.72rem}
.loc.neutrale{border-color:var(--border)}
.loc.occ1{border-color:var(--p1)}
.loc.occ2{border-color:var(--p2)}
.loc.conteso{border-color:var(--warn);border-width:2px}
.locrow{display:flex;gap:8px;overflow-x:auto;align-items:stretch;padding-bottom:4px}
.locrow .loc{flex:0 0 230px;min-width:230px}
.loc-heading{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:5px}
.loc-card{margin-bottom:8px}
.loc-card .gamecard{cursor:default}
.player-tag{display:inline-block;margin:2px 0 5px;padding:2px 7px;border:1px solid;border-radius:999px;font-size:.68rem;font-weight:bold}
.player-tag.p1{color:var(--p1);border-color:var(--p1);background:var(--surface)}
.player-tag.p2{color:var(--p2);border-color:var(--p2);background:var(--surface)}
.manual-controls{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px}
.manual-controls .btn{margin:1px;padding:4px 7px}
.manual-board{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.manual-board .pill{margin:2px 0}
.manual-value{width:54px!important;padding:2px 4px!important}
.zone-cards{display:flex;flex-wrap:wrap;gap:6px;margin:5px 0}
#log{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px;height:150px;overflow-y:auto;font-size:.74rem;overflow-x:auto}
.formgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
.small{font-size:.72rem;color:var(--muted)}
.tag{display:inline-block;background:var(--surface2);border-radius:4px;padding:1px 5px;font-size:.68rem;margin-right:3px}
.flex-between{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.banner{background:var(--warn);color:#1b1815;border-radius:8px;padding:10px;margin-bottom:10px;font-weight:bold}
.scorepip{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--border);margin-right:2px}
.scorepip.won{background:var(--accent)}
.navlink{display:inline-block;background:transparent;border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:6px;font-size:.85rem;text-decoration:none}
</style>
</head>
<body>
<header>
  <h1>⚜ Le Ceneri del Divino</h1>
  <nav id="tabs"></nav>
  <a class="navlink" href="stampa-carte.html">Stampa carte →</a>
</header>
<main>
  <div class="tab active" id="tab-partita"></div>
  <div class="tab" id="tab-carte"></div>
  <div class="tab" id="tab-mazzi"></div>
  <div class="tab" id="tab-dati"></div>
</main>

<script>
/* ====================== ICONE / COSTANTI ====================== */
const ICO = {
 inf:`<svg class="icon" viewBox="0 0 24 24"><path d="M12 2l3 7h7l-5.5 4.5L18.5 21 12 16.5 5.5 21l2-7.5L2 9h7z" fill="var(--warn)"/></svg>`,
 cor:`<svg class="icon" viewBox="0 0 24 24"><path d="M12 2C9 7 5 10 5 14.5A7 7 0 0019 14.5C19 10 15 7 12 2z" fill="var(--accent)"/></svg>`,
 pre:`<svg class="icon" viewBox="0 0 24 24"><path d="M12 2l2.6 6.9L22 9.5l-5.6 4.8L18 22l-6-4-6 4 1.6-7.7L2 9.5l7.4-.6z" fill="var(--accent2)"/></svg>`,
 type:{
   personaggio:`<svg class="gc-icon" viewBox="0 0 24 24"><circle cx="12" cy="7" r="4" fill="currentColor"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8" fill="currentColor"/></svg>`,
   luogo:`<svg class="gc-icon" viewBox="0 0 24 24"><path d="M12 2C7.6 2 4 5.6 4 10c0 6 8 12 8 12s8-6 8-12c0-4.4-3.6-8-8-8zm0 11a3 3 0 110-6 3 3 0 010 6z" fill="currentColor"/></svg>`,
   rito:`<svg class="gc-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M12 5.5l1.8 4.6h4.7l-3.8 2.9 1.4 4.6L12 14.9l-4.1 2.7 1.4-4.6-3.8-2.9h4.7z" fill="currentColor"/></svg>`,
   evento:`<svg class="gc-icon" viewBox="0 0 24 24"><path d="M13 2L4 14h6l-1 8 9-12h-6z" fill="currentColor"/></svg>`,
 },
};
const FACTIONS = ["La Comunione","Creature della notte","Devoti dei Primi Figli","Gli Spontanei","Le Accademie del Velo","I Ducati del Nord","La Corona di Velaria","Il Regno delle Luci","I Domini del Ponente","Le Terre Contese"];
const uid = ()=>Math.random().toString(36).slice(2,10);
function typeLabel(t){ return {personaggio:'Personaggio',luogo:'Luogo',rito:'Rito',evento:'Evento'}[t]||t; }
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function esc(s){ return (s||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }

/* ====================== STATO ====================== */
let S = {
  pool: [], decks: [], playerDeck:[null,null],
  players: [newPlayer("Giocatore 1"), newPlayer("Giocatore 2")],
  locations: freshLocations(),
  ai:[null,null],
  matchScore:[0,0], round:1, started:false, matchOver:null,
  stage:'idle', // manual sandbox; legacy phases remain for older helpers
  prepPlacer:0, prepFirstPlacer:0, luoghiPlaced:0, prepPassStreak:0,
  mulliganDone:[false,false], mulliganSel:[[],[]],
  active:0, cardPlayedThisTurn:false, passStreak:0,
  activeEvent:null, activeEventOwner:null,
  pendingAIEffect:null,
  showDeck:[false,false], showDiscard:[false,false], showRemoved:[false,false],
  log:[],
};
function newPlayer(name){ return {name, influence:0, corruption:0, prestige:0, deck:[], hand:[], discard:[], removed:[], persistentRiti:[], faction:null}; }
function freshLocations(){ return Array.from({length:6},()=>({cardId:null, builder:null, chars:[]})); }
let sel = { skirmishOffer:null, choosingDefender:null };
let mazziView = { mode:'list' };
let cardOpen = {};
function toggleCardOpen(key){ cardOpen[key]=!cardOpen[key]; render(); }
let toast = null;
function showToast(t){ toast={text:t}; render(); }
function toastHtml(){
  if(!toast) return '';
  return `<div class="banner" style="background:var(--accent);color:#fff">${esc(toast.text)} <button class="btn ghost" style="border-color:#fff;color:#fff" onclick="toast=null;render()">✕</button></div>`;
}
let confirmingDelete = {};

function cardById(id){ return S.pool.find(c=>c.id===id); }
function logMsg(t){ S.log.unshift(`[Round ${S.round}${S.stage==='play'?' · '+S.players[S.active].name:''}] ${t}`); }

/* ====================== RISORSE ====================== */
function changeCorruption(pi, delta){
  const p=S.players[pi]; const before=p.corruption;
  p.corruption=Math.max(0,p.corruption+delta);
  if(delta>0 && S.stage!=='manual'){
    const thBefore=Math.floor(before/5), thAfter=Math.floor(p.corruption/5);
    for(let t=thBefore+1;t<=thAfter;t++){ removeTopFromDeck(pi); logMsg(`${p.name}: soglia di Corruzione ${t*5} raggiunta → una carta viene rimossa dalla partita.`); }
  }
  if(delta>0 && S.stage==='manual' && Math.floor(before/5)<Math.floor(p.corruption/5)){
    logMsg(`${p.name} supera una soglia di Corruzione: gestisci manualmente l'eventuale rimozione di carte.`);
  }
  render();
}
function removeTopFromDeck(pi){
  const p=S.players[pi];
  if(!p.deck.length){ logMsg(`${p.name}: mazzo vuoto, nessuna carta da rimuovere.`); return; }
  const id=p.deck.shift(); p.removed.push(id);
  logMsg(`${p.name} rimuove dalla partita "${cardById(id)?.name||'?'}".`);
}
function changePrestige(pi, delta){ S.players[pi].prestige=Math.max(0,S.players[pi].prestige+delta); render(); }
function changeInfluence(pi, delta){
  const p=S.players[pi];
  p.influence=Math.max(0,p.influence+delta);
  if(S.stage!=='manual') p.influence=Math.min(10,p.influence);
  render();
}
function setManualResource(pi,resource,value){
  if(!['influence','corruption','prestige'].includes(resource)) return;
  const amount=Number.parseInt(value,10);
  if(!Number.isFinite(amount)) return;
  S.players[pi][resource]=Math.max(0,amount);
  render();
}

function drawCard(pi){
  const p=S.players[pi];
  if(!p.deck.length){
    if(S.stage==='manual'){
      showToast(p.discard.length
        ? `Mazzo di ${p.name} vuoto: mischia manualmente gli scarti nel mazzo.`
        : `Mazzo e scarti di ${p.name} vuoti.`);
      return;
    }
    if(!p.discard.length){ logMsg(`${p.name}: mazzo e scarti vuoti, nessuna pescata possibile.`); return; }
    p.deck=shuffle(p.discard); p.discard=[];
    logMsg(`${p.name} rimescola gli Scarti nel Mazzo (mazzo esaurito).`);
  }
  const id=p.deck.shift(); p.hand.push(id);
  logMsg(`${p.name} pesca una carta (mano: ${p.hand.length}).`);
}

/* ====================== AVVIO PARTITA / ROUND ====================== */
function deckCountOf(deck){ return deck? deck.list.reduce((s,e)=>s+e.qty,0) : 0; }
function deckValidFull(deck){
  if(!deck || deckCountOf(deck)!==30) return false;
  for(const e of deck.list){ const c=cardById(e.cardId); if(!c) return false;
    if(c.fazione!=='Comune' && !deck.factions.includes(c.fazione)) return false;
    if(c.legendary && e.qty>1) return false; if(!c.legendary && e.qty>3) return false; }
  return true;
}
function addCardToDeck(deckId,cardId){
  const deck=S.decks.find(d=>d.id===deckId); if(!deck) return;
  const c=cardById(cardId);
  if(c.fazione!=='Comune' && !deck.factions.includes(c.fazione)){ showToast(`Questa carta appartiene a "${c.fazione}", non selezionata per questo mazzo.`); return; }
  let e=deck.list.find(x=>x.cardId===cardId); const max=c.legendary?1:3;
  if(e){ if(e.qty<max) e.qty++; } else deck.list.push({cardId,qty:1});
  render();
}
function removeCardFromDeck(deckId,cardId){
  const deck=S.decks.find(d=>d.id===deckId); if(!deck) return;
  const e=deck.list.find(x=>x.cardId===cardId);
  if(!e) return; e.qty--; if(e.qty<=0) deck.list=deck.list.filter(x=>x!==e);
  render();
}
function toggleDeckFaction(deckId, fac){
  const deck=S.decks.find(d=>d.id===deckId); if(!deck) return;
  const i=deck.factions.indexOf(fac);
  if(i>=0) deck.factions.splice(i,1);
  else { if(deck.factions.length>=2){ showToast('Un mazzo può avere al massimo due fazioni (oltre alle carte Comuni).'); return; } deck.factions.push(fac); }
  render();
}
function renameDeck(deckId,name){ const deck=S.decks.find(d=>d.id===deckId); if(!deck) return; deck.name=name; saveLocal(); }
function createDeck(){ const d={id:uid(), name:'Nuovo mazzo', factions:[], list:[]}; S.decks.push(d); mazziView={mode:'edit',deckId:d.id}; render(); }
function duplicateDeck(deckId){ const deck=S.decks.find(d=>d.id===deckId); if(!deck) return;
  const copy=JSON.parse(JSON.stringify(deck)); copy.id=uid(); copy.name=deck.name+' (copia)'; S.decks.push(copy); render(); }
function deleteDeck(deckId){
  S.decks=S.decks.filter(d=>d.id!==deckId);
  S.playerDeck=S.playerDeck.map(id=>id===deckId?null:id);
  if(mazziView.deckId===deckId) mazziView={mode:'list'};
  render();
}
function openDeckEditor(deckId){ mazziView={mode:'edit',deckId}; render(); }
function backToDeckList(){ mazziView={mode:'list'}; render(); }
function setPlayerDeck(pi, deckId){ S.playerDeck[pi]=deckId||null; render(); }
function setAI(pi, level){ S.ai[pi]= level||null; render(); }

function startMatch(){
  for(let pi=0;pi<2;pi++){
    const deck=S.decks.find(d=>d.id===S.playerDeck[pi]); let ids=[];
    if(!deck){ showToast(`Seleziona un mazzo per ${S.players[pi].name}.`); return; }
    deck.list.forEach(e=>{ for(let i=0;i<e.qty;i++) ids.push(e.cardId); });
    const p=S.players[pi];
    p.deck=ids; p.hand=[]; p.discard=[]; p.removed=[]; p.persistentRiti=[];
    p.influence=0; p.corruption=0; p.prestige=0; p.deckName=deck.name; p.factions=deck.factions.slice();
  }
  S.matchScore=[0,0]; S.round=1; S.matchOver=null; S.log=[]; S.started=true;
  S.locations=freshLocations(); S.activeEvent=null; S.activeEventOwner=null;
  S.active=0; S.stage='manual'; S.ai=[null,null]; S.pendingAIEffect=null;
  sel={skirmishOffer:null,choosingDefender:null};
  logMsg(`Sandbox manuale avviata — ${S.players[0].name} (${S.players[0].deckName}) contro ${S.players[1].name} (${S.players[1].deckName}).`);
  render();
}
function startRound(){
  for(let pi=0;pi<2;pi++){
    const p=S.players[pi];
    let ret=[...p.hand, ...p.discard, ...p.persistentRiti];
    S.locations.forEach(l=>{ l.chars.filter(c=>c.owner===pi).forEach(c=>ret.push(c.cardId)); if(l.cardId && l.builder===pi) ret.push(l.cardId); });
    p.deck=shuffle([...p.deck, ...ret]);
    p.hand=[]; p.discard=[]; p.persistentRiti=[]; p.prestige=0; p.influence=0;
  }
  S.locations=freshLocations(); S.activeEvent=null; S.activeEventOwner=null;
  S.prepFirstPlacer=Math.random()<0.5?0:1; S.prepPlacer=S.prepFirstPlacer;
  S.luoghiPlaced=0; S.prepPassStreak=0; S.mulliganDone=[false,false]; S.mulliganSel=[[],[]];
  S.pendingAIEffect=null; sel={skirmishOffer:null,choosingDefender:null};
  S.stage='prep-place';
  logMsg(`— Preparazione del Round ${S.round} — inizia a posizionare ${S.players[S.prepFirstPlacer].name}.`);
  for(let pi=0;pi<2;pi++) for(let i=0;i<3;i++) drawCard(pi);
  render();
  driveAIPrep();
}

/* ====================== PREPARAZIONE: PIAZZAMENTO LUOGHI ====================== */
function placeLuogoPrep(pi, handIdx, slot){
  if(S.stage!=='prep-place' || S.prepPlacer!==pi) return;
  const p=S.players[pi]; const id=p.hand[handIdx]; const c=cardById(id);
  if(!c||c.type!=='luogo'||S.locations[slot].cardId||S.luoghiPlaced>=3) return;
  p.hand.splice(handIdx,1);
  S.locations[slot]={cardId:id, builder:pi, chars:[]};
  S.luoghiPlaced++; S.prepPassStreak=0;
  logMsg(`${p.name} posiziona gratuitamente "${c.name}" nello spazio ${slot+1}.`);
  if(S.luoghiPlaced>=3){ beginMulliganStage(); return; }
  S.prepPlacer=1-pi; render(); driveAIPrep();
}
function passPrepPlacement(pi){
  if(S.stage!=='prep-place' || S.prepPlacer!==pi) return;
  S.prepPassStreak++; logMsg(`${S.players[pi].name} non posiziona alcun Luogo.`);
  if(S.prepPassStreak>=2){
    if(S.luoghiPlaced===0){
      logMsg('Nessun Luogo in campo: le mani vengono rimescolate e la Preparazione ricomincia.');
      for(let i=0;i<2;i++){ const pl=S.players[i]; pl.deck=shuffle([...pl.deck,...pl.hand]); pl.hand=[]; }
      S.prepFirstPlacer=1-S.prepFirstPlacer; S.prepPlacer=S.prepFirstPlacer; S.prepPassStreak=0;
      for(let i=0;i<2;i++) for(let k=0;k<3;k++) drawCard(i);
      render(); driveAIPrep(); return;
    }
    beginMulliganStage(); return;
  }
  S.prepPlacer=1-pi; render(); driveAIPrep();
}
function beginMulliganStage(){
  S.stage='prep-mulligan';
  for(let pi=0;pi<2;pi++){
    const p=S.players[pi]; p.discard.push(...p.hand); p.hand=[]; p.influence=5;
    for(let i=0;i<6;i++) drawCard(pi);
  }
  logMsg('Fine piazzamento: Influenza a 5, mano scartata e ripescate 6 carte. Ora si può fare mulligan (max 2 carte).');
  render(); driveAIMulligan();
}
function toggleMulliganPick(pi, idx){
  if(S.mulliganDone[pi]) return;
  const arr=S.mulliganSel[pi]; const at=arr.indexOf(idx);
  if(at>=0) arr.splice(at,1); else if(arr.length<2) arr.push(idx);
  render();
}
function confirmMulligan(pi){
  if(S.mulliganDone[pi]) return;
  const p=S.players[pi]; const idxs=[...S.mulliganSel[pi]].sort((a,b)=>b-a);
  idxs.forEach(i=>{ const id=p.hand.splice(i,1)[0]; p.deck.push(id); });
  p.deck=shuffle(p.deck);
  for(let k=0;k<idxs.length;k++) drawCard(pi);
  S.mulliganDone[pi]=true; S.mulliganSel[pi]=[];
  logMsg(`${p.name} sostituisce ${idxs.length} carta/e e mischia il mazzo.`);
  render();
  if(S.mulliganDone[0]&&S.mulliganDone[1]) beginPlayStage();
}
function beginPlayStage(){
  S.stage='play'; S.active=S.prepFirstPlacer; S.cardPlayedThisTurn=false; S.passStreak=0;
  logMsg(`— Inizia il turno di gioco del Round ${S.round}. Comincia ${S.players[S.active].name}. —`);

}

/* ====================== FASE DI GIOCO ====================== */
function turnStart(){
  if(S.matchOver || S.stage!=='play') return;
  drawCard(S.active); render();
  if(S.ai[S.active] && !S.pendingAIEffect) aiTakeTurn(S.active);
}
function finishCardAction(pi, card){
  if(S.stage==='manual') return;
  if(card && card.effetto && S.ai[pi]){ S.pendingAIEffect={pi,name:card.name,effetto:card.effetto}; render(); return; }
  endPlayTurn();
}
function ackAIEffect(){ S.pendingAIEffect=null; endPlayTurn(); }
function endPlayTurn(){
  const p=S.players[S.active];
  p.influence=Math.min(10,p.influence+2);
  logMsg(`${p.name} termina il turno (+2 Influenza).`);
  S.passStreak = S.cardPlayedThisTurn? 0 : S.passStreak+1;
  if(S.passStreak>=2){ enterRoundEnd(); return; }
  S.active=1-S.active; S.cardPlayedThisTurn=false; sel={skirmishOffer:null,choosingDefender:null};
  render();
  turnStart();
}
function passTurn(pi){
  if(S.stage!=='play'||S.active!==pi||S.cardPlayedThisTurn) return;
  logMsg(`${S.players[pi].name} passa.`);
  endPlayTurn();
}
function setManualActivePlayer(pi){ S.active=Number(pi); render(); }
function changeManualRound(delta){ S.round=Math.max(1,S.round+delta); render(); }

  S.players.forEach(p=>{ p.deck=[]; p.hand=[]; p.discard=[]; p.removed=[]; p.persistentRiti=[]; });
  S.activeEvent=null; S.activeEventOwner=null; S.log=[]; render();
}

function shuffleDiscardIntoDeck(pi){

function moveDeckCard(pi,idx,destination){

function tradeScore(atk,def){
  let s=0;
  if((atk.forza||0)>=(def.resistenza||0)) s+=3;
  if((def.forza||0)>=(atk.resistenza||0)) s-=3;
  s += ((atk.forza||0)-(def.forza||0))*0.3 + ((atk.resistenza||0)-(def.resistenza||0))*0.2;
  return s;
}
function resolveSingleSkirmish(slot, attackerInstId, defenderInstId){
  const l=S.locations[slot]; const atk=l.chars.find(c=>c.instId===attackerInstId);
  if(!atk) return;
  if(!defenderInstId){ logMsg('Nessun difensore scelto: nessuno scontro.'); return; }
  const def=l.chars.find(c=>c.instId===defenderInstId); if(!def) return;
  const ac=cardById(atk.cardId), dc=cardById(def.cardId);
  atk.dmg+=(dc.forza||0); def.dmg+=(ac.forza||0);
  logMsg(`Scontro di presidio: "${ac.name}" vs "${dc.name}" — danni scambiati.`);
  l.chars=l.chars.filter(c=>{
    const cc=cardById(c.cardId); const dead=c.dmg>=(cc.resistenza||0);
    if(dead){ S.players[c.owner].discard.push(c.cardId); logMsg(`"${cc.name}" sconfitto e messo negli scarti.`); }
    return !dead;
  });
}
function deployCharacter(pi, handIdx, slot, aiLevel){
  if(S.stage!=='manual' && !aiLevel && (S.stage!=='play'||S.active!==pi||S.cardPlayedThisTurn)) return;
  const p=S.players[pi]; const id=p.hand[handIdx]; const c=cardById(id);
  if(!c||c.type!=='personaggio'||!S.locations[slot].cardId) return;
  if(S.stage!=='manual'){
    if(p.influence<(c.costInf||0)){ if(!aiLevel) showToast('Influenza insufficiente.'); return; }
    p.influence-=(c.costInf||0);
  }
  p.hand.splice(handIdx,1);
  const inst={instId:uid(), cardId:id, owner:pi, dmg:0};
  S.locations[slot].chars.push(inst);
  if(S.stage==='manual'){
    logMsg(`${p.name} schiera manualmente "${c.name}" nel luogo ${slot+1}.`);
    render();
    return;
  }
  S.cardPlayedThisTurn=true;
  logMsg(`${p.name} schiera "${c.name}" nel luogo ${slot+1}.`);
  const oppHere=S.locations[slot].chars.some(ch=>ch.owner!==pi);
  if(!oppHere){ finishCardAction(pi,c); render(); return; }
  if(aiLevel){
    const defenders=S.locations[slot].chars.filter(ch=>ch.owner!==pi).map(ch=>cardById(ch.cardId));
    const willAttack = aiLevel==='facile'? Math.random()<0.6 : defenders.some(dc=>tradeScore(c,dc)>-2);
    if(willAttack){
      const defSeat=1-pi;
      if(S.ai[defSeat]){ const defId=aiChooseDefender(slot,id,defSeat,S.ai[defSeat]); resolveSingleSkirmish(slot,inst.instId,defId); finishCardAction(pi,c); }
      else { sel.choosingDefender={slot, attackerInstId:inst.instId}; }
    } else finishCardAction(pi,c);
  } else {
    sel.skirmishOffer={slot, attackerInstId:inst.instId};
  }
  render();
}
function humanStartSkirmish(yes){
  const {slot,attackerInstId}=sel.skirmishOffer; sel.skirmishOffer=null;
  const atkInst=S.locations[slot].chars.find(c=>c.instId===attackerInstId); const pi=atkInst.owner; const defSeat=1-pi;
  if(!yes){ finishCardAction(pi, cardById(atkInst.cardId)); render(); return; }
  if(S.ai[defSeat]){
    const defId=aiChooseDefender(slot, atkInst.cardId, defSeat, S.ai[defSeat]);
    resolveSingleSkirmish(slot, attackerInstId, defId);
    finishCardAction(pi, cardById(atkInst.cardId));
  } else { sel.choosingDefender={slot, attackerInstId}; }
  render();
}
function humanPickDefender(defInstId){
  const {slot,attackerInstId}=sel.choosingDefender; sel.choosingDefender=null;
  const atkInst=S.locations[slot].chars.find(c=>c.instId===attackerInstId); const pi=atkInst.owner;
  resolveSingleSkirmish(slot, attackerInstId, defInstId);
  finishCardAction(pi, cardById(atkInst.cardId));
  render();
}
function aiChooseDefender(slot, attackerCardId, pi, level){
  const atkCard=cardById(attackerCardId);
  const opts=S.locations[slot].chars.filter(c=>c.owner===pi);
  if(!opts.length) return null;
  if(level==='facile') return Math.random()<0.5? opts[Math.floor(Math.random()*opts.length)].instId : null;
  let best=null,bestScore=-Infinity;
  opts.forEach(o=>{ const dc=cardById(o.cardId); const sc=-tradeScore(atkCard,dc); if(sc>bestScore){bestScore=sc;best=o;} });
  if(level==='medio' && Math.random()<0.25) return opts[Math.floor(Math.random()*opts.length)].instId;
  return bestScore>-2.5? best.instId : null;
}

function playLocationFromHand(pi,handIdx,slot){

/* ====================== FINE ROUND ====================== */
function locStatus(l){
  const has1=l.chars.some(c=>c.owner===0), has2=l.chars.some(c=>c.owner===1);
  if(has1&&has2) return "conteso"; if(has1) return "occ1"; if(has2) return "occ2"; return "neutrale";
}
function enterRoundEnd(){
  S.stage='round-end';
  S.locations.forEach((l,i)=>{
    const st=locStatus(l);
    if(l.cardId && (st==='occ1'||st==='occ2')){
      const pi=st==='occ1'?0:1; const c=cardById(l.cardId);
      if(c.prestigio){ S.players[pi].prestige+=c.prestigio; logMsg(`${S.players[pi].name} ottiene ${c.prestigio} Prestigio da "${c.name}" (luogo ${i+1}).`); }
    }
  });
  const [a,b]=S.players; let roundWinner=null;
  if(a.prestige>b.prestige) roundWinner=0; else if(b.prestige>a.prestige) roundWinner=1;
  if(roundWinner!==null){ S.matchScore[roundWinner]++; logMsg(`🏅 ${S.players[roundWinner].name} vince il Round ${S.round} (${a.prestige}-${b.prestige}).`); }
  else logMsg(`Round ${S.round} in parità (${a.prestige}-${b.prestige}): nessun punto.`);
  if(S.matchScore[0]>=2||S.matchScore[1]>=2) S.matchOver = S.matchScore[0]>S.matchScore[1]? S.players[0].name : S.players[1].name;
  else if(S.round>=3) S.matchOver='Pareggio';
  render();
}
function nextRound(){
  if(S.stage==='manual'){ S.round++; render(); return; }
  if(S.matchOver) return;
  S.round++; startRound();
}

/* ====================== IA ====================== */
function aiTakeTurn(pi){
  const level=S.ai[pi]; const p=S.players[pi];
  const playable=p.hand.map((id,idx)=>({id,idx,c:cardById(id)})).filter(h=>h.c);
  const options=[];
  playable.forEach(h=>{
    const c=h.c;
    if(c.type==='personaggio' && p.influence>=(c.costInf||0)) S.locations.forEach((l,slot)=>{ if(l.cardId) options.push({type:'char',h,slot}); });
    if(c.type==='luogo' && p.influence>=(c.costInf||0) && p.corruption>=0) S.locations.forEach((l,slot)=>{ if(!l.cardId) options.push({type:'loc',h,slot}); });
    if(c.type==='rito' && p.influence>=(c.costInf||0)) options.push({type:'rito',h});
    if(c.type==='evento' && p.influence>=(c.costInf||0)) options.push({type:'evento',h});
  });
  if(!options.length){ passTurn(pi); return; }
  function scoreOpt(o){
    const c=o.h.c; let s=(c.effetto?1:0)*1.2;
    if(o.type==='loc') s += (c.prestigio||0)*2 - (c.costInf||0)*0.3;
    if(o.type==='char'){
      const occ=S.locations[o.slot].chars; const oppHere=occ.filter(ch=>ch.owner!==pi);
      s += 1 - (c.costInf||0)*0.25 + (c.forza||0)*0.3 + (c.resistenza||0)*0.2;
      if(oppHere.length){ let best=-Infinity; oppHere.forEach(d=>{ const sc=tradeScore(c,cardById(d.cardId)); if(sc>best) best=sc; }); s+=best; }
      else if(!occ.length) s+=0.5;
    }
    if(o.type==='rito'||o.type==='evento') s += 0.8 - (c.costInf||0)*0.2;
    return s;
  }
  let chosen;
  if(level==='facile'){ chosen=options[Math.floor(Math.random()*options.length)]; }
  else {
    options.forEach(o=>o.score=scoreOpt(o)); options.sort((a,b)=>b.score-a.score);
    chosen = (level==='medio' && options.length>1 && Math.random()<0.3) ? options[1] : options[0];
    if(chosen.score<-1 && Math.random()<0.6){ passTurn(pi); return; }
  }
  if(chosen.type==='char') deployCharacter(pi, chosen.h.idx, chosen.slot, level);
  else if(chosen.type==='loc') playLocationFromHand(pi, chosen.h.idx, chosen.slot);
  else if(chosen.type==='rito') playRitoFromHand(pi, chosen.h.idx);
  else if(chosen.type==='evento') playEventFromHand(pi, chosen.h.idx);
}
function driveAIPrep(){
  if(S.stage!=='prep-place') return;
  const pi=S.prepPlacer; const level=S.ai[pi]; if(!level) return;
  const p=S.players[pi]; const luoghi=p.hand.map((id,idx)=>({id,idx,c:cardById(id)})).filter(h=>h.c.type==='luogo');
  if(!luoghi.length || S.luoghiPlaced>=3){ passPrepPlacement(pi); return; }
  let pick = level==='facile'? luoghi[Math.floor(Math.random()*luoghi.length)] : luoghi.sort((a,b)=>(b.c.prestigio||0)-(a.c.prestigio||0))[0];
  const empty=S.locations.map((l,i)=>l.cardId?null:i).filter(i=>i!==null);
  const slot = empty[Math.floor(Math.random()*empty.length)];
  placeLuogoPrep(pi, pick.idx, slot);
}
function driveAIMulligan(){
  for(let pi=0;pi<2;pi++){
    const level=S.ai[pi]; if(!level||S.mulliganDone[pi]) continue;
    const p=S.players[pi];
    if(level!=='facile'){
      const costly=p.hand.map((id,idx)=>({idx,c:cardById(id)})).filter(h=>h.c&&(h.c.costInf||0)>=5).sort((a,b)=>(b.c.costInf)-(a.c.costInf)).slice(0,2);
      S.mulliganSel[pi]=costly.map(h=>h.idx);
    }
    confirmMulligan(pi);
  }
}

function discardToDeck(pi,idx,pos){ const p=S.players[pi]; const id=p.discard.splice(idx,1)[0]; if(id===undefined) return; if(pos==='top') p.deck.unshift(id); else p.deck.push(id); logMsg(`${p.name} rimette "${cardById(id)?.name}" dagli scarti ${pos==='top'?'in cima':'in fondo'} al mazzo.`); render(); }
function discardToRemoved(pi,idx){ const p=S.players[pi]; const id=p.discard.splice(idx,1)[0]; if(id===undefined) return; p.removed.push(id); logMsg(`${p.name} rimuove manualmente "${cardById(id)?.name}" dagli scarti.`); render(); }
function removedToHand(pi,idx){ const p=S.players[pi]; const id=p.removed.splice(idx,1)[0]; if(id===undefined) return; p.hand.push(id); logMsg(`${p.name} riprende in mano "${cardById(id)?.name}" dalle carte rimosse.`); render(); }
function removedToDiscard(pi,idx){ const p=S.players[pi]; const id=p.removed.splice(idx,1)[0]; if(id===undefined) return; p.discard.push(id); logMsg(`${p.name} sposta "${cardById(id)?.name}" dalle rimosse agli scarti.`); render(); }
function removedToDeck(pi,idx,pos){ const p=S.players[pi]; const id=p.removed.splice(idx,1)[0]; if(id===undefined) return; if(pos==='top') p.deck.unshift(id); else p.deck.push(id); logMsg(`${p.name} rimette "${cardById(id)?.name}" dalle rimosse ${pos==='top'?'in cima':'in fondo'} al mazzo.`); render(); }
function shuffleDeck(pi){ S.players[pi].deck=shuffle(S.players[pi].deck); logMsg(`${S.players[pi].name} mischia il mazzo.`); render(); }

/* ====================== EXPORT / IMPORT / SALVATAGGIO LOCALE ====================== */
const SAVE_KEY = 'ceneri-del-divino-dati';
function saveLocal(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify({pool:S.pool, decks:S.decks, playerDeck:S.playerDeck})); }catch(e){} }
function loadLocal(){
  try{
    const raw=localStorage.getItem(SAVE_KEY); if(!raw) return;
    const o=JSON.parse(raw);
    if(o.pool) S.pool=o.pool.map(c=>({fazione:'Comune',tipologia:'',...c}));
    if(o.decks) S.decks=o.decks;
    if(o.playerDeck) S.playerDeck=o.playerDeck;
  }catch(e){}
}
function clearLocal(){
  if(!confirm('Cancellare pool carte e mazzi salvati in questo browser? La partita in corso non viene toccata.')) return;
  try{ localStorage.removeItem(SAVE_KEY); }finally{ location.reload(); }
}
async function exportData(){
  const data=JSON.stringify({pool:S.pool, decks:S.decks, playerDeck:S.playerDeck},null,2);
  try{ const d=await claude.use("downloads"); if(d){ await d.save({filename:"ceneri-del-divino-dati.json", data}); return; } }catch(e){}
  const blob=new Blob([data],{type:"application/json"}); const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download="ceneri-del-divino-dati.json"; a.click();
}
function importData(file){
  const r=new FileReader();
  r.onload=()=>{ try{ const o=JSON.parse(r.result);
      if(o.pool) S.pool=o.pool.map(c=>({fazione:'Comune',tipologia:'',...c}));
      if(o.decks) S.decks=o.decks;
      if(o.playerDeck) S.playerDeck=o.playerDeck;
      saveLocal(); render();
    }catch(e){ showToast('File non valido.'); } };
  r.readAsText(file);
}

/* ====================== CARD FACE ====================== */
function cardFace(c, inst, forceOpen=false){
  if(!c) return '';
  const key = inst? inst.instId : c.id;
  const isOpen = forceOpen || !!cardOpen[key];
  const dmg = inst && inst.dmg? `<div class="gc-dmg">Danni subiti: ${inst.dmg}</div>`:'';
  let sub=[typeLabel(c.type)];
  sub.push(c.fazione && c.fazione!=='Comune'? c.fazione : 'Comune');
  if(c.tipologia) sub.push(c.tipologia);
  if(c.type==='luogo') sub.push('Prestigio prodotto: '+(c.prestigio||0));
  if(c.type==='rito') sub.push(c.ritoTipo==='persistente'?'Persistente':'Immediato');
  if(c.costPre) sub.push('Costo Prestigio '+c.costPre);
  if(c.legendary) sub.push('Leggendaria');
  const art = (c.imagePath||c.image) ? `<img class="gc-art" src="${esc(c.imagePath||c.image)}" onerror="this.style.display='none'">` : '';
  const nameWords=(c.name||'').trim().split(/\s+/);
  const firstWord=nameWords.shift()||'';
  const remainingName=nameWords.join(' ');
  return `<div class="gamecard type-${c.type} ${isOpen?'open':''}">
    <div class="gc-rightcol">
      ${c.type==='personaggio'?`<div class="gc-stat">F ${c.forza||0}<br>R ${c.resistenza||0}</div>`:''}
      <div class="gc-badges">
        <span class="gc-badge inf" title="Costo Influenza">${c.costInf||0}</span>
        ${c.costCor?`<span class="gc-badge cor" title="Costo Corruzione">${c.costCor}</span>`:''}
      </div>
    </div>
    <div class="gc-name"><span class="gc-firstline">${ICO.type[c.type]||''}<span>${esc(firstWord)}</span></span>${remainingName?` ${esc(remainingName)}`:''}
      ${forceOpen?'':`<button class="gc-toggle" onclick="event.stopPropagation();toggleCardOpen('${key}')" title="Mostra/nascondi dettagli">${isOpen?'▲':'ⓘ'}</button>`}
    </div>
    <div class="gc-full">
      ${art}
      <div class="gc-sub">${sub.join(' · ')}</div>
      <div class="gc-effect">${esc(c.effetto||'')||'<span class=\"small\">(nessun testo effetto)</span>'}</div>
      ${dmg}
    </div>
  </div>`;
}

function setTab(t){ activeTab=t; render(); }
function render(){
  const tabsEl=document.getElementById('tabs');
  const tabs=[['partita','Partita'],['carte','Carte'],['mazzi','Mazzi'],['dati','Dati']];
  tabsEl.innerHTML=tabs.map(([k,l])=>`<button class="${activeTab===k?'active':''}" onclick="setTab('${k}')">${l}</button>`).join('');

  document.getElementById('tab-'+activeTab).classList.add('active');
  renderPartita(); renderCarte(); renderMazzi(); renderDati();

}

function handCardFooter(pi, idx, c){
  let h='';
  if(S.stage==='manual'){
    if(c.type==='personaggio'){
      const built=S.locations.map((l,i)=>l.cardId?i:null).filter(i=>i!==null);
      h += built.map(s=>`<button class="btn" onclick="deployCharacter(${pi},${idx},${s})">→ Luogo ${s+1}</button>`).join('')||'<span class="small">Posiziona prima un Luogo</span>';
    }
    if(c.type==='luogo'){
      const empty=S.locations.map((l,i)=>l.cardId?null:i).filter(i=>i!==null);
      h += empty.map(s=>`<button class="btn" onclick="playLocationFromHand(${pi},${idx},${s})">→ Spazio ${s+1}</button>`).join('')||'<span class="small">Fila piena</span>';
    }
    if(c.type==='rito') h += `<button class="btn" onclick="playRitoFromHand(${pi},${idx})">Sposta nei riti / scarti</button>`;
    if(c.type==='evento') h += `<button class="btn" onclick="playEventFromHand(${pi},${idx})">Imposta come Evento attivo</button>`;
  }
  if(S.stage==='prep-place' && S.prepPlacer===pi && !S.ai[pi] && c.type==='luogo' && S.luoghiPlaced<3){
    const empty=S.locations.map((l,i)=>l.cardId?null:i).filter(i=>i!==null);
    h += empty.map(s=>`<button class="btn" onclick="placeLuogoPrep(${pi},${idx},${s})">Spazio ${s+1} (gratis)</button>`).join('');
  }
  if(S.stage==='play' && !S.ai[pi] && !S.pendingAIEffect && !sel.skirmishOffer && !sel.choosingDefender){
    if(S.active===pi && !S.cardPlayedThisTurn){
      if(c.type==='personaggio'){
        const built=S.locations.map((l,i)=>l.cardId?i:null).filter(i=>i!==null);
        h += built.map(s=>`<button class="btn" onclick="deployCharacter(${pi},${idx},${s})">→ Luogo ${s+1}</button>`).join('')||'<span class="small">Nessun Luogo in campo</span>';
      }
      if(c.type==='luogo'){
        const empty=S.locations.map((l,i)=>l.cardId?null:i).filter(i=>i!==null);
        h += empty.map(s=>`<button class="btn" onclick="playLocationFromHand(${pi},${idx},${s})">→ Spazio ${s+1}</button>`).join('')||'<span class="small">Fila piena</span>';
      }
      if(c.type==='rito') h += `<button class="btn" onclick="playRitoFromHand(${pi},${idx})">Esegui rito</button>`;
      if(c.type==='evento') h += `<button class="btn" onclick="playEventFromHand(${pi},${idx})">Richiama evento</button>`;
    }
    if(S.active!==pi && c.type==='rito' && c.ritoTipo!=='persistente'){
      h += `<button class="btn ghost" onclick="playRitoAsResponse(${pi},${idx})">⚡ Istantaneo (risposta)</button>`;
    }
  }
  h += `<button class="btn ghost" onclick="discardFromHand(${pi},${idx})">Scarta</button>
        <button class="btn ghost" onclick="handCardToDeck(${pi},${idx},'top')">⤒Cima</button>
        <button class="btn ghost" onclick="handCardToDeck(${pi},${idx},'bottom')">⤓Fondo</button>
        ${S.stage==='manual'?`<button class="btn ghost" onclick="discardFromHandToRemoved(${pi},${idx})">Rimuovi</button>`:''}`;
  return h;
}

        <button class="btn ghost" onclick="discardToDeck(${pi},${i},'bottom')">→ Fondo</button>
        ${S.stage==='manual'?`<button class="btn ghost" onclick="discardToRemoved(${pi},${i})">→ Rimosse</button>`:''}</div></div>`; }).join('')||'<span class="small">Vuoto</span>'}</div>`:''}
      <div class="flex-between"><h4>Rimosse dalla partita (${p.removed.length})</h4><button class="btn ghost" onclick="S.showRemoved[${pi}]=!S.showRemoved[${pi}];render()">${S.showRemoved[pi]?'Nascondi':'Mostra'}</button></div>
      ${S.showRemoved[pi]? `<div class="areaist">${p.removed.map((id,i)=>{ const c=cardById(id); if(!c) return '';
        return `<div class="minicard">${cardFace(c)}<div class="manual-controls">
          <button class="btn ghost" onclick="removedToHand(${pi},${i})">→ Mano</button>
          <button class="btn ghost" onclick="removedToDiscard(${pi},${i})">→ Scarti</button>
          <button class="btn ghost" onclick="removedToDeck(${pi},${i},'top')">→ Cima mazzo</button>
          <button class="btn ghost" onclick="removedToDeck(${pi},${i},'bottom')">→ Fondo mazzo</button>
        </div></div>`; }).join('')||'<span class="small">Vuoto</span>'}</div>`:''}
    </div>`;
  }
  html += `</div>`;

  html += `<div class="card"><h3>Fila dei luoghi</h3><div class="locrow">`;
  S.locations.forEach((l,slot)=>{
    const st=locStatus(l); const c=l.cardId?cardById(l.cardId):null;
    html += `<div class="loc ${st}"><div class="loc-heading"><b>Luogo ${slot+1}</b><span class="small">${st}</span></div>`;
    if(c){
      html += `<div class="loc-card">${cardFace(c,null,true)}
        <div class="manual-controls">
          <button class="btn ghost" onclick="moveLocationCard(${slot},'hand')">→ Mano</button>
          <button class="btn ghost" onclick="moveLocationCard(${slot},'discard')">→ Scarti</button>
          <button class="btn ghost" onclick="moveLocationCard(${slot},'top')">→ Cima mazzo</button>
          <button class="btn ghost" onclick="moveLocationCard(${slot},'bottom')">→ Fondo mazzo</button>
          <button class="btn ghost" onclick="moveLocationCard(${slot},'removed')">→ Rimosse</button>
          ${S.players.map((player,pi)=>`<button class="btn ghost" onclick="changeLocationOwner(${slot},${pi})">Controllo: ${esc(player.name)}</button>`).join('')}
          ${S.locations.map((target,i)=>i!==slot&&!S.locations[i].cardId&&!S.locations[i].chars.length?`<button class="btn ghost" onclick="moveLocationToSlot(${slot},${i})">→ Spazio ${i+1}</button>`:'').join('')}
        </div>
      </div>`;
    }
    else html += `<div class="small">Slot libero</div>`;
    l.chars.forEach(ch=>{ const cc=cardById(ch.cardId);
      if(!cc) return;
      const player = S.players[ch.owner];
      const seat = ch.owner===0?'p1':'p2';
      html += `<div class="minicard" style="max-width:190px">${cardFace(cc,ch)}<span class="player-tag ${seat}">${esc(player.name)}</span>
        <div class="manual-controls">
          <span class="small">Danni: ${ch.dmg||0}</span>
          <button class="btn ghost" onclick="adjustCharacterDamage(${slot},'${ch.instId}',-1)">− danno</button>
          <button class="btn ghost" onclick="adjustCharacterDamage(${slot},'${ch.instId}',1)">+ danno</button>
          ${S.locations.map((target,i)=>i!==slot?`<button class="btn ghost" onclick="moveCharacterToLocation(${slot},'${ch.instId}',${i})">→ Luogo ${i+1}</button>`:'').join('')}
          ${S.players.map((player,pi)=>`<button class="btn ghost" onclick="changeCharacterOwner(${slot},'${ch.instId}',${pi})">Controllo: ${esc(player.name)}</button>`).join('')}
          <button class="btn ghost" onclick="moveCharacterFromLocation(${slot},'${ch.instId}','hand')">→ Mano</button>
          <button class="btn ghost" onclick="moveCharacterFromLocation(${slot},'${ch.instId}','discard')">→ Scarti</button>
          <button class="btn ghost" onclick="moveCharacterFromLocation(${slot},'${ch.instId}','top')">→ Cima mazzo</button>
          <button class="btn ghost" onclick="moveCharacterFromLocation(${slot},'${ch.instId}','bottom')">→ Fondo mazzo</button>
          <button class="btn ghost" onclick="moveCharacterFromLocation(${slot},'${ch.instId}','removed')">→ Rimosse</button>
        </div>
      </div>`;
    });
    html += `</div>`;
  });
  html += `</div><button class="btn ghost" onclick="stopManualMatch()">Termina sandbox</button></div>`;

  html += `<div class="card"><h3>Registro</h3><div id="log">${S.log.map(esc).join('<br>')}</div></div>`;
  el.innerHTML=html;
}

function renderCarte(){
  const el=document.getElementById('tab-carte');
  const editing=editingCard?cardById(editingCard):null;
  el.innerHTML = toastHtml() + `<div class="card"><h2>${editing?'Modifica carta':'Nuova carta'}</h2>
    <form id="cardForm" class="formgrid" onsubmit="return false">
      <input name="name" placeholder="Nome" value="${editing?esc(editing.name):''}" required>
      <select name="type">${['personaggio','luogo','rito','evento'].map(t=>`<option value="${t}" ${editing&&editing.type===t?'selected':''}>${typeLabel(t)}</option>`).join('')}</select>
      <select name="fazione"><option value="Comune" ${!editing||editing.fazione==='Comune'?'selected':''}>Comune</option>${FACTIONS.map(f=>`<option value="${f}" ${editing&&editing.fazione===f?'selected':''}>${f}</option>`).join('')}</select>
      <input name="tipologia" placeholder="Tipologia (es. Umano, Non morto)" value="${editing?esc(editing.tipologia||''):''}">
      <label class="small"><input type="checkbox" name="legendary" ${editing&&editing.legendary?'checked':''}> Leggendaria</label>
      <input name="costInf" type="number" min="0" placeholder="Costo Influenza" value="${editing?editing.costInf||0:0}">
      <input name="costCor" type="number" min="0" placeholder="Costo Corruzione" value="${editing?editing.costCor||0:0}">
      <input name="costPre" type="number" min="0" placeholder="Costo Prestigio" value="${editing?editing.costPre||0:0}">
      <input name="forza" type="number" min="0" placeholder="Forza" value="${editing?editing.forza||0:0}">
      <input name="resistenza" type="number" min="0" placeholder="Resistenza" value="${editing?editing.resistenza||0:0}">
      <input name="prestigio" type="number" min="0" placeholder="Prestigio prodotto" value="${editing?editing.prestigio||0:0}">
      <select name="ritoTipo"><option value="immediato" ${editing&&editing.ritoTipo==='immediato'?'selected':''}>Rito immediato</option><option value="persistente" ${editing&&editing.ritoTipo==='persistente'?'selected':''}>Rito persistente</option></select>
      <input name="imagePath" placeholder="Percorso immagine (es. img/nome.png)" value="${editing?esc(editing.imagePath||''):''}" style="grid-column:1/-1">
      <textarea name="effetto" placeholder="Testo effetto" style="grid-column:1/-1">${editing?esc(editing.effetto||''):''}</textarea>
      <div style="grid-column:1/-1"><button class="btn" onclick="submitCardForm()">${editing?'Salva modifiche':'Aggiungi al pool'}</button>${editing?'<button class="btn ghost" onclick="editingCard=null;render()">Annulla</button>':''}</div>
    </form></div>
    <div class="card"><h2>Pool carte (${S.pool.length})</h2>
    <div class="handlist">${S.pool.map(c=>`<div class="minicard">${cardFace(c)}<div style="margin-top:3px">
      ${confirmingDelete[c.id]?
        `<span class="small">Eliminare "${esc(c.name)}"?</span> <button class="btn alt" onclick="deleteCard('${c.id}')">Conferma</button><button class="btn ghost" onclick="cancelDeleteCard('${c.id}')">Annulla</button>`
        :`<button class="btn ghost" onclick="editingCard='${c.id}';render()">✎ Modifica</button><button class="btn ghost" onclick="askDeleteCard('${c.id}')">🗑 Elimina</button>`}
      </div></div>`).join('')||'<span class="small">Nessuna carta.</span>'}</div></div>`;
}
function submitCardForm(){
  const f=document.getElementById('cardForm');
  upsertCard({ name:f.name.value.trim()||'Senza nome', type:f.type.value, fazione:f.fazione.value, tipologia:f.tipologia.value.trim(),
    legendary:f.legendary.checked, costInf:+f.costInf.value||0, costCor:+f.costCor.value||0, costPre:+f.costPre.value||0,
    forza:+f.forza.value||0, resistenza:+f.resistenza.value||0, prestigio:+f.prestigio.value||0,
    ritoTipo:f.ritoTipo.value, imagePath:f.imagePath.value.trim(), effetto:f.effetto.value.trim() });
}

function renderMazzi(){
  const el=document.getElementById('tab-mazzi');
  if(mazziView.mode==='edit'){
    const deck=S.decks.find(d=>d.id===mazziView.deckId);
    if(!deck){ mazziView={mode:'list'}; el.innerHTML=''; return; }
    const avail=S.pool.filter(c=>c.fazione==='Comune'||deck.factions.includes(c.fazione));
    el.innerHTML = toastHtml() + `<div class="card">
      <button class="btn ghost" onclick="backToDeckList()">← Torna ai mazzi</button>
      <div class="row" style="align-items:center;margin-top:8px">
        <input value="${esc(deck.name)}" oninput="renameDeck('${deck.id}',this.value)" style="font-size:1rem;font-weight:bold;max-width:260px">
        <span class="small">${deckCountOf(deck)}/30 ${deckValidFull(deck)?'✅':'❌'}</span>
      </div>
      <div class="small" style="margin:8px 0 2px">Fazioni del mazzo (massimo 2, oltre alle carte Comuni):</div>
      <div class="row">${FACTIONS.map(f=>`<label class="small"><input type="checkbox" style="width:auto" ${deck.factions.includes(f)?'checked':''} ${(!deck.factions.includes(f)&&deck.factions.length>=2)?'disabled':''} onchange="toggleDeckFaction('${deck.id}','${f}')"> ${f}</label>`).join('')}</div>
      <div class="row" style="margin-top:10px">
        <div class="col"><h4>Pool disponibile (Comune${deck.factions.length?' + '+deck.factions.join(', '):''})</h4>
          ${avail.map(c=>`<div class="minicard" onclick="addCardToDeck('${deck.id}','${c.id}')">${cardFace(c)}</div>`).join('')||'<span class="small">Nessuna carta: seleziona almeno una fazione.</span>'}</div>
        <div class="col"><h4>Nel mazzo</h4>
          ${deck.list.map(e=>{const c=cardById(e.cardId); if(!c) return ''; return `<div class="minicard"><div class="small">×${e.qty}</div>${cardFace(c)}<button class="btn ghost" onclick="removeCardFromDeck('${deck.id}','${c.id}')">− Rimuovi</button></div>`}).join('')||'<span class="small">Vuoto</span>'}</div>
      </div>
    </div>`;
    return;
  }
  el.innerHTML = toastHtml() + `<div class="card">
    <div class="flex-between"><h2>Mazzi (${S.decks.length})</h2><button class="btn" onclick="createDeck()">+ Nuovo mazzo</button></div>
    <div class="row">${S.decks.map(d=>`<div class="col" style="border:1px solid var(--border);border-radius:8px;padding:8px;background:var(--surface2);max-width:260px">
      <b>${esc(d.name)}</b><br><span class="small">${d.factions.join(', ')||'nessuna fazione'} — ${deckCountOf(d)}/30 ${deckValidFull(d)?'✅':'❌'}</span><br>
      <button class="btn ghost" onclick="openDeckEditor('${d.id}')">✎ Modifica</button>
      <button class="btn ghost" onclick="duplicateDeck('${d.id}')">⧉ Duplica</button>
      <button class="btn ghost" onclick="deleteDeck('${d.id}')">🗑 Elimina</button>
    </div>`).join('')||'<span class="small">Nessun mazzo ancora: crealo con il pulsante qui sopra.</span>'}</div>
  </div>`;
}
function renderDati(){
  document.getElementById('tab-dati').innerHTML = toastHtml() + `<div class="card"><h2>Esporta / Importa dati</h2>
    <p class="small">Pool carte e mazzi vengono salvati automaticamente nel browser (localStorage): non serve importare il file ad ogni apertura. Usa Esporta/Importa per backup o per trasferire i dati su un altro browser o dispositivo — è lo stesso formato usato da Stampa Carte.</p>
    <button class="btn" onclick="exportData()">⬇ Esporta dati</button>
    <div style="margin-top:10px"><label class="small">Importa file: <input type="file" accept=".json" onchange="importData(this.files[0])"></label></div>
    <p class="small" style="margin-top:10px">Nota: la partita in corso non viene esportata né salvata automaticamente, solo pool carte e mazzi.</p>
    <button class="btn ghost" style="margin-top:6px" onclick="clearLocal()">🗑 Cancella dati salvati nel browser</button>
    </div>`;
}

loadLocal();
render();
</script>
</body>
</html>
