<!DOCTYPE html>
<html lang="it"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ceneri del Divino — Simulatore</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f5f2ec;--sf:#fff;--bd:#d8d0c0;--tx:#2a2420;--mut:#726a5e;--ac:#7a2e2e;--g1:#2e4a3f;--g2:#5a2e6b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1815;--sf:#262220;--bd:#443d36;--tx:#ece6dd;--mut:#a89d8d;--ac:#d98a8a;--g1:#8fd1b8;--g2:#d6a8e8;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1815;--sf:#262220;--bd:#443d36;--tx:#ece6dd;--mut:#a89d8d;--ac:#d98a8a;--g1:#8fd1b8;--g2:#d6a8e8;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:14px Georgia,serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1{font-size:1.1rem;color:var(--ac);margin:0;padding:12px 14px;border-bottom:2px solid var(--ac)}
h2{font-size:1rem;margin:0 0 8px}main{padding:10px 14px;max-width:1000px;margin:auto}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:10px}
label{display:block;margin:4px 0;font-size:.85rem}.m{color:var(--mut);font-size:.8rem}
button,select,input{font:inherit;font-size:.85rem;background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:5px 9px}
button{cursor:pointer}button.p{background:var(--g1);color:var(--bg);border-color:var(--g1)}button:disabled{opacity:.4}
.row{display:flex;gap:8px;flex-wrap:wrap}.col{flex:1;min-width:230px}
.scroll{overflow-x:auto}table{border-collapse:collapse;font-size:.78rem;width:100%}th,td{border-bottom:1px solid var(--bd);padding:3px 6px;text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}
pre{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px;max-height:420px;overflow:auto;font-size:.72rem;white-space:pre-wrap}
.warn{color:var(--ac);font-weight:bold}details{margin:6px 0}summary{cursor:pointer;font-weight:bold}
progress{width:100%}
</style></head><body>
<h1>⚜ Ceneri del Divino · Simulatore (regole v0.6.2)</h1>
<main>
<div class="card"><h2>1 · Carte e mazzi</h2>
<label>Carte (Excel .xlsx, foglio «Tutte le carte») <input type="file" id="fx" accept=".xlsx,.xls"></label>
<label>Mazzi (JSON) <input type="file" id="fj" accept=".json"></label>
<button id="ba">Genera mazzi automatici</button> <button id="bt">Scarica modello JSON</button>
<p class="m" id="st">Carica prima l’Excel delle carte.</p></div>
<div class="card"><h2>2 · Simulazione</h2><div class="row">
<div class="col"><b>Giocatore A</b><label>Mazzo <select id="da"></select></label><label>IA <select id="aa"><option value="euristica">Euristica</option><option value="casuale">Casuale (baseline)</option></select></label></div>
<div class="col"><b>Giocatore B</b><label>Mazzo <select id="db"></select></label><label>IA <select id="ab"><option value="euristica">Euristica</option><option value="casuale">Casuale (baseline)</option></select></label></div></div>
<label>Partite <input type="number" id="n" value="1000" min="1" max="100000" style="width:90px"> · log dettagliati per le prime <input type="number" id="nl" value="5" min="0" max="50" style="width:60px"> partite</label>
<button class="p" id="go" disabled>Avvia simulazione</button><progress id="pg" value="0" max="1" hidden></progress></div>
<div id="out"></div>
</main>
<script>
const $=i=>document.getElementById(i);
const EXC=['La Comunione','Devoti dei Primi Figli','Gli Spontanei'];
const DEAD=[];
const N=v=>parseFloat(String(v==null?'':v).replace(',','.'))||0;
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let CARDS=[],DECKS=[],g;
const cb=n=>CARDS.find(c=>c.n===n);
function parseCards(rows){CARDS=rows.filter(r=>r.nome&&!EXC.includes(String(r.fazione||'').trim())).map(r=>({n:String(r.nome).trim(),t:String(r.categoria||'').trim(),leg:!!r.legendario,f:String(r.fazione||'').trim(),i:N(r.influenza),c:N(r.corruzione),ty:String(r.tipologia||'').replace('-','').trim(),F:N(r.forza),p:N(r.prestigio),per:/Persistente/.test(r.categ_tipo||'')}))}
function autoDecks(){const fs=[...new Set(CARDS.filter(c=>!['Comune','N/A'].includes(c.f)).map(c=>c.f))];
 return fs.map(f=>{const l=[];[...CARDS.filter(c=>c.f===f&&c.t!=='Evento'),...CARDS.filter(c=>c.f==='Comune'&&c.t!=='Evento')].forEach(c=>{for(let k=0;k<(c.leg?1:2);k++)l.push(c.n)});return{nome:'Auto · '+f,fazione:f,l:l.slice(0,20)}})}
const toJson=ds=>JSON.stringify({decks:ds.map(d=>({nome:d.nome,fazione:d.fazione,carte:Object.entries(d.l.reduce((o,n)=>(o[n]=(o[n]||0)+1,o),{})).map(([nome,qty])=>({nome,qty}))}))},null,1);

/* ============ MOTORE ============ */
const lg=s=>{if(g.v)g.log.push(s)};
const O=p=>g.P[1-p.i];const evn=()=>g.ev?g.ev.n:'';
function draw(p,n=1){for(;n>0;n--){if(!p.deck.length){if(!p.disc.length)return;p.deck=shuf(p.disc);p.disc=[];lg(`  ${p.n}: scarti rimescolati nel mazzo`)}const c=p.deck.shift();p.hand.push(c);p.seen.add(c.n);lg(`  ${p.n} pesca «${c.n}»`)}}
const gain=(p,n)=>{p.inf=Math.min(9,p.inf+n)};
function addCor(p,n){if(n>0){if(g.L.some(l=>l.c&&l.c.n==="Santuario dimenticato"&&l.ctrl===p.i)&&!p.sant){p.sant=1;n=Math.max(0,n-1)}if(n>0)p.corT=1}
 p.cor=Math.max(0,p.cor+n);while(p.cor>9){p.cor-=10;p.pre-=2;p.src.cor-=2;p.wrap++;lg(`  ⚠ ${p.n} supera 9 di Corruzione: −2 Prestigio, indicatore a ${p.cor}`)}}
function hf(l,h){const c=h.c,o=h.o,P=g.P[o],ln=l.c?l.c.n:'';let f=c.F+h.b;
 if((c.n==='Lupo'||c.n==='Spettro')&&l.c&&l.c.f===P.fz)f++;
 if(c.n==="Il Guardiano Contorto")f+=l.ch.filter(x=>x!==h&&x.o===o&&/Bestia|Non morto/.test(x.c.ty)).length;
 if(c.ty==='Non morto'&&l.ch.some(x=>x!==h&&x.o===o&&x.c.n==='Custode dei sepolcri'))f++;
 if(l.ctrl===o){if(ln==='Forte Miramare')f++;if(ln==='Strada del Re'&&c.f===P.fz)f++;if(ln==='Tana'&&c.ty==='Bestia')f++}
 return f}
const FT=(l,o)=>l.ch.reduce((s,h)=>s+(h.o===o?hf(l,h):0),0);
function ctrlOf(l){const f=[FT(l,0),FT(l,1)],m=Math.max(...f);if(m<=0)return -1;if(f[0]===f[1])return 2;const o=f[0]>f[1]?0:1;if(evn()==='Rivolta dei contadini'&&m-f[1-o]<2)return -1;return o}
const V=(l,o)=>{const c=ctrlOf(l);return c===o?l.c.p+1:c===1-o?-(l.c.p+1):0};
const tot=o=>g.L.reduce((s,l)=>l.c?s+V(l,o):0,0);
const swingC=(l,o,c)=>{const b=V(l,o);l.ch.push({c,o,b:0});const a=V(l,o);l.ch.pop();return a-b};
const swing=(l,o,d)=>swingC(l,o,{F:d,ty:'',n:'x',f:'',p:0,c:0,i:0});
const ownCh=p=>g.L.flatMap(l=>l.ch.filter(h=>h.o===p.i).map(h=>({l,h})));
const enCh=p=>g.L.flatMap(l=>l.ch.filter(h=>h.o!==p.i).map(h=>({l,h})));
const corTgt=p=>enCh(p).filter(x=>x.h.c.c>0);
function kill(l,h,why){l.ch.splice(l.ch.indexOf(h),1);g.P[h.o].disc.push(h.c);lg(`  ✖ «${h.c.n}» di ${g.P[h.o].n} scartato [${why}]`)}
function rmLoc(l){l.ch.forEach(h=>g.P[h.o].disc.push(h.c));g.P[l.b].disc.push(l.c);lg(`  ✖ Luogo «${l.c.n}» scartato con i personaggi presenti`);l.c=null;l.ch=[];l.ctrl=-1}
function killBest(p,max,why){const t=enCh(p).filter(x=>hf(x.l,x.h)<=max).sort((a,b)=>hf(b.l,b.h)+b.l.c.p-hf(a.l,a.h)-a.l.c.p)[0];if(t)kill(t.l,t.h,why);return!!t}
function boost(p,n){const t=ownCh(p).map(x=>({...x,s:swing(x.l,p.i,n)})).sort((a,b)=>b.s-a.s)[0];if(t){t.h.b+=n;lg(`  «${t.h.c.n}» +${n}💪 (luogo ${g.L.indexOf(t.l)+1})`)}return!!t}
const cap=p=>evn()==='La Caccia'&&g.L.filter(l=>l.ctrl===p.i).length>=g.L.filter(l=>l.ctrl===1-p.i).length;
function cost(p,c){let i=c.i,k=c.c;
 if(c.t==='Rito'){if(evn()==='Concilio di Zamorbelle')i--;if(evn()==='Nasce il Supremo Consiglio Arcano'&&!p.ritE){i--;k--}if(p.rd)i--}
 if(c.t==='Personaggio'){const e=evn();if(e==="Scoperta dell'Acciaio Nero"&&!p.chE&&!p.corT)i--;if(e==='Morbo a Scaglie'&&!p.chT&&g.L.some(l=>l.ctrl===p.i&&l.ch.some(h=>h.o!==p.i)))i++}
 return[Math.max(0,i),Math.max(0,k)]}
function peek(p,mode){const t=p.deck[0];if(t&&((t.t==='Luogo'&&!g.L.some(l=>!l.c))||t.i>p.inf+4)){if(mode==='scarta')p.disc.push(p.deck.shift());else p.deck.push(p.deck.shift());lg(`  ${p.n} guarda «${t.n}» e la ${mode==='scarta'?'scarta':'mette in fondo'}`)}}
function dep(p,c,l,o={}){
 let ci=0,ck=0;if(!o.free){[ci,ck]=cost(p,c);ci=Math.max(0,ci-(o.red||0));p.inf-=ci;addCor(p,ck)}
 const ix=p.hand.indexOf(c);if(ix>=0)p.hand.splice(ix,1);
 const h={c,o:p.i,b:0,tmp:o.tmp};l.ch.push(h);p.plays[c.n]=(p.plays[c.n]||0)+1;
 const en=l.ch.some(x=>x.o!==p.i),e=evn();
 lg(`  ${p.n} schiera «${c.n}» (F${c.F}${o.free?', gratis':`, −${ci}🪙${ck?` +${ck}🟣`:''}`}) nel luogo ${g.L.indexOf(l)+1} «${l.c.n}»${o.tmp?' [temporaneo]':''}`);
 if(!o.free&&!o.tmp){
  if(e==='Fondazione di Imaskar'&&!en&&!p.fc1){p.fc1=1;h.b++;lg('  Evento: +1💪')}
  if(e==='Guerra dei Tre Passi'&&en&&!p.fc2){p.fc2=1;h.b++;lg('  Evento: +1💪')}
  if(e==='Notte delle Luci Danzanti'&&en&&p.cor<7){addCor(p,1);h.b++;lg('  Evento: +1🟣 per +1💪')}
  if(c.i<=2&&!p.minT&&g.L.some(x=>x.c&&x.c.n==='Miniere di Luminaria'&&x.ctrl===p.i)){p.minT=1;gain(p,1);lg('  Miniere di Luminaria: +1🪙')}
  p.chE=1;p.chT=1}
 if(!o.noFx&&FX[c.n])FX[c.n](p,l,h)}
function build(p,c,s,free){const[i,k]=free?[0,0]:cost(p,c);p.inf-=i;addCor(p,k);const ix=p.hand.indexOf(c);if(ix>=0)p.hand.splice(ix,1);
 const l=g.L[s];l.c=c;l.b=p.i;l.ch=[];l.ctrl=-1;p.plays[c.n]=(p.plays[c.n]||0)+1;
 lg(`  ${p.n} costruisce «${c.n}» nello spazio ${s+1}${free?' (gratis)':` (−${i}🪙${k?` +${k}🟣`:''})`}`);
 if((evn()==='Fondazione di Zegroshtak'||evn()==='Spedizione di Jugo')&&!p.lcE){p.lcE=1;gain(p,2);lg('  Evento: +2🪙')}
 const ch=p.hand.filter(x=>x.t==='Personaggio'&&p.inf>=cost(p,x)[0]&&!(cap(p)&&p.chT)).map(x=>({c:x,s:swingC(l,p.i,x)+.15*x.F})).sort((a,b)=>b.s-a.s)[0];
 if(ch&&(p.ai==='casuale'||ch.s>0)){lg('  (schieramento contestuale: costo pagato, nessuna azione consumata)');dep(p,ch.c,l)}}
const silBest=p=>{let best=null;g.L.forEach((a,i)=>{const m=a.ch.filter(h=>h.o===p.i);if(!m.length)return;[i-1,i+1].forEach(j=>{const b=g.L[j];if(!b||!b.c)return;const t0=tot(p.i),sa=a.ch.slice(),sb=b.ch.slice();a.ch=a.ch.filter(h=>h.o!==p.i);m.forEach(h=>{h.b++;b.ch.push(h)});const t1=tot(p.i);a.ch=sa;b.ch=sb;m.forEach(h=>h.b--);if(!best||t1-t0>best.g)best={g:t1-t0,a,b,m}})});return best};
const ddBest=p=>{let b=null;p.disc.filter(c=>c.t==='Personaggio').forEach(c=>g.L.forEach(l=>{if(!l.c)return;const s=swingC(l,p.i,c);if(!b||s>b.s)b={c,l,s}}));return b};
const FX={
"Adepto dell'Accademia":p=>{if(p.cor<7){addCor(p,1);draw(p)}},
"Resti che camminano":p=>{if(p.cor<7){addCor(p,1);draw(p)}},
"Tessitore":p=>{if(p.cor<6){addCor(p,1);gain(p,1)}},
"Esploratore":p=>peek(p,'fondo'),
"Il Primo di Zamorbelle":p=>gain(p,g.L.filter(l=>l.ctrl===p.i).length),
"Messaggero":p=>addCor(p,-2),
"Mercenario veterano":(p,l,h)=>{if(p.inf>=1&&l.ch.some(x=>x.o!==p.i)){p.inf--;h.b++;lg('  paga 1🪙: +1💪')}},
"Lupo feroce":(p,l)=>{const w=p.deck.filter(c=>c.n==='Lupo');if(p.inf>=2&&w.length){p.inf-=2;p.deck=shuf(p.deck.filter(c=>c.n!=='Lupo'));w.forEach(c=>l.ch.push({c,o:p.i,b:0}));lg(`  paga 2🪙: schiera ${w.length} Lupo dal mazzo`)}},
"Duellante mercenario":(p,l,h)=>{const t=l.ch.filter(x=>x.o!==p.i&&hf(l,x)<=hf(l,h)).sort((a,b)=>hf(l,a)-hf(l,b))[0];if(t)kill(l,t,'Duellante')},
"Ombra":(p,l)=>l.ch.filter(h=>h.o!==p.i&&h.c.F<=2).forEach(h=>kill(l,h,'Ombra')),
"Profanatore":(p,l,h0)=>{const t=l.ch.filter(h=>h!==h0&&h.o!==p.i&&hf(l,h)<=3).sort((a,b)=>hf(l,b)-hf(l,a))[0];if(t)kill(l,t,'Profanatore')},
"Necromante":(p,l)=>{const c=p.disc.filter(x=>x.ty==='Non morto').sort((a,b)=>b.F-a.F)[0];if(c&&p.cor<8){addCor(p,1);p.disc.splice(p.disc.indexOf(c),1);dep(p,c,l,{free:1,noFx:1})}},
"Gli Sposi della Notte":p=>{const c=p.disc.filter(x=>x.ty==='Bestia').sort((a,b)=>b.F-a.F)[0];if(c){p.disc.splice(p.disc.indexOf(c),1);p.hand.push(c);lg(`  riprende «${c.n}» dagli scarti`)}},
"Cristiano Dirimetti, Conte di Midesta":(p,l0,h0)=>{const s=g.L.findIndex(l=>!l.c),b=p.hand.length;draw(p,2);const nw=p.hand.slice(b),lu=nw.find(x=>x.t==='Luogo');if(lu&&s>=0&&nw.length>1){const o=nw[nw.indexOf(lu)===0?1:0];p.hand.splice(p.hand.indexOf(o),1);p.disc.push(o);build(p,lu,s,1);const x=moveBest(p,g.L[s],h0);if(x)moveChar(p,x,'Cristiano Dirimetti')}},
"Elenoire, estirpatrice di eretici":p=>{const c=[...corTgt(p).map(x=>({v:hf(x.l,x.h),f:()=>kill(x.l,x.h,'Elenoire')})),...g.L.filter(l=>l.c&&l.b!==p.i&&l.c.c>0).map(l=>({v:l.c.p*2+l.ch.filter(h=>h.o!==p.i).length-l.ch.filter(h=>h.o===p.i).length,f:()=>rmLoc(l)}))].sort((a,b)=>b.v-a.v)[0];if(c)c.f()}};
const RT={
"Accordo precario":p=>{draw(p,2);gain(p,1)},
"Martello della Redenzione":p=>boost(p,3),
"Tessitura proibita":p=>{addCor(p,1);boost(p,2)},
"Squarcio nel Velo":p=>killBest(p,4,'Squarcio nel Velo'),
"Ritirata strategica":p=>{const t=g.L.filter(l=>l.c&&l.ch.some(h=>h.o===p.i)).sort((a,b)=>V(a,p.i)-V(b,p.i))[0];if(!t)return;const m=t.ch.filter(h=>h.o===p.i);t.ch=t.ch.filter(h=>h.o!==p.i);m.forEach(h=>p.hand.push(h.c));gain(p,2*m.length);lg(`  ritira ${m.length} personaggi dal luogo ${g.L.indexOf(t)+1}: +${2*m.length}🪙`)},
"Silenzio della Mietitrice":p=>{const b=silBest(p);if(b){b.a.ch=b.a.ch.filter(h=>h.o!==p.i);b.m.forEach(h=>{h.b++;b.b.ch.push(h)});lg(`  sposta ${b.m.length} personaggi dal luogo ${g.L.indexOf(b.a)+1} al ${g.L.indexOf(b.b)+1} (+1💪)`)}},
"Difesa disperata":p=>{const d=ddBest(p);if(d){p.disc.splice(p.disc.indexOf(d.c),1);dep(p,d.c,d.l,{free:1,tmp:1,noFx:1})}},
"Richiamo della Notte":p=>{const c=p.disc.filter(x=>/Non morto|Bestia/.test(x.ty)).sort((a,b)=>b.F-a.F)[0];if(!c)return;p.disc.splice(p.disc.indexOf(c),1);p.hand.push(c);lg(`  riprende «${c.n}»`);const a=bestOf(p,c);if(a&&a.k==='char'&&a.s>.3)dep(p,c,a.l)},
"Sciame di Mezzanotte":p=>{const b=p.hand.length;draw(p,2);const c=p.hand.slice(b).find(x=>x.t==='Personaggio'&&x.F<=2);if(c){const a=cardActs(p,c).map(x=>({...x,s:swingC(x.l,p.i,c)})).sort((x,y)=>y.s-x.s)[0];if(a&&p.inf>=Math.max(0,cost(p,c)[0]-1))dep(p,c,a.l,{red:1})}}};
function rs(p,c){const my=ownCh(p),en=enCh(p),n=c.n;
 if(n==='Accordo precario')return p.inf<7&&p.cor<7?1.4:-9;
 if(n==='Martello della Redenzione'||n==='Tessitura proibita'){const s=Math.max(-9,...my.map(x=>swing(x.l,p.i,n[0]==='M'?3:2)));return s>0?s+.2:-9}
 if(n==='Squarcio nel Velo'){const t=en.filter(x=>hf(x.l,x.h)<=4);return t.length?1+Math.max(...t.map(x=>hf(x.l,x.h)*.4+x.l.c.p*.3)):-9}
 if(n==='Ritirata strategica')return g.L.some(l=>l.c&&V(l,p.i)<0&&l.ch.some(h=>h.o===p.i))?.8:-9;
 if(n==='Silenzio della Mietitrice'){const s=silBest(p);return s&&s.g>0?s.g+.3:-9}
 if(n==='Difesa disperata'){const d=ddBest(p);return d&&d.s>0?d.s*.9:-9}
 if(n==='Richiamo della Notte')return p.disc.some(x=>/Non morto|Bestia/.test(x.ty))?1:-9;
 if(n==='Sciame di Mezzanotte')return 1.2;
 if(n.startsWith('E-don'))return .4+corTgt(p).length;
 if(n==='Prova di Ghyza')return .9;
 if(n==='Studi architetturali')return .7;
 if(n==='Furia della Bestia')return my.some(x=>/Bestia|Non morto/.test(x.h.c.ty))||p.hand.some(x=>/Bestia|Non morto/.test(x.ty))?.9:.3;
 return .5}
function cardActs(p,c){const r=[],[i]=cost(p,c);if(p.inf<i)return r;
 if(c.t==='Personaggio'){if(!(cap(p)&&p.chT))g.L.forEach(l=>l.c&&r.push({k:'char',c,l}))}
 else if(c.t==='Luogo')g.L.forEach((l,s)=>!l.c&&r.push({k:'loc',c,sl:s}));
 else if(c.t==='Rito'&&!(evn()==='Concilio di Zamorbelle'&&p.ritT)&&rs(p,c)>-9)r.push({k:'rit',c});
 return r}
function score(p,a){const[i,k]=cost(p,a.c);let s=-i*.12-k*.35-(p.cor>6?k*.5:0)-(p.cor+k>9?2.2:0);
 if(a.k==='char')s+=swingC(a.l,p.i,a.c)+.15*a.c.F+.4+(FX[a.c.n]?.4:0)+(a.l.ch.some(h=>h.o!==p.i)?.2:0);

$('go').addEventListener('click',async()=>{const b=$('go'),pg=$('pg');b.disabled=true;pg.hidden=false;
 try{const dk=[DECKS[+$('da').value],DECKS[+$('db').value]],ai=[$('aa').value,$('ab').value],n=Math.max(1,+$('n').value||1),nl=Math.min(n,+$('nl').value||0),A=mkA();LOGS=[];
  for(let k=0;k<n;k++){const r=playGame(dk,ai,Math.random()<.5?0:1,k<nl);agg(A,r.g,r.w);if(k<nl)LOGS.push(r.g.log.join('\n'));if(k%25===24){pg.value=k/n;await new Promise(r=>setTimeout(r))}}
  $('out').innerHTML=report(A,dk,ai)+(nl?`<div class="card"><h2>Log dettagliati</h2><label>Partita <select id="ls">${LOGS.map((_,i)=>`<option value="${i}">#${i+1}</option>`).join('')}</select></label><button id="dlb">Scarica tutti i log (.txt)</button><pre id="lg"></pre></div>`:'');
  if(nl){showLog(0);$('ls').addEventListener('change',e=>showLog(+e.target.value));$('dlb').addEventListener('click',()=>dl('log-partite.txt',LOGS.join('\n\n##########\n\n'),'text/plain'))}
 }catch(x){$('out').innerHTML='<div class="card warn">Errore: '+x.message+'</div>';console.error(x)}finally{b.disabled=false;pg.hidden=true}});
</script></body></html>
